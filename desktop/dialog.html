<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Renatel Shop POS</title>
<style>
:root{--bg:#fff;--tx:#1d1d1b;--mut:#6b6a63;--bd:#e0ded6;--ac:#0f6e56;--act:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#212120;--tx:#efeee8;--mut:#a09f96;--bd:#37362f;--ac:#3cc19b;--act:#08201a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding:20px}
#msg{white-space:pre-wrap;overflow-wrap:anywhere;flex:1;overflow:auto;margin:0 0 12px}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-bottom:12px}
input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.row{display:flex;justify-content:flex-end;gap:8px}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 18px;cursor:pointer;min-width:84px}
button.pri{background:var(--ac);color:var(--act);border-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<p id="msg"></p>
<input id="in" hidden autocomplete="off">
<div class="row"><button id="cancel" hidden>Cancel</button><button id="ok" class="pri">OK</button></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var type = q.get('type') || 'alert';
  document.getElementById('msg').textContent = q.get('message') || '';
  var input = document.getElementById('in'), ok = document.getElementById('ok'), cancel = document.getElementById('cancel');
  if (type === 'prompt') { input.hidden = false; input.value = q.get('def') || ''; }
  if (type !== 'alert') cancel.hidden = false;
  function accept() { window.dlg.done(type === 'prompt' ? input.value : true); }
  function reject() { window.dlg.done(type === 'prompt' ? null : type === 'confirm' ? false : true); }
  ok.addEventListener('click', accept);
  cancel.addEventListener('click', reject);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); accept(); }
    else if (e.key === 'Escape') { e.preventDefault(); reject(); }
  });
  window.addEventListener('load', function () {
    if (type === 'prompt') { input.focus(); input.select(); } else { ok.focus(); }
  });
})();
</script>
</body>
</html>
