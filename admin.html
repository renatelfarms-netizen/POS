<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="icon" href="/icon-192.png">
<!--PLAT-->
<style>
:root{--ac:#0f6e56;--tx:#14201b;--mut:#5d6b65;--bd:#e3e7e4;--bg:#f6f5f1;--card:#fff;--bad:#c2410c}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:1.5rem;margin:0}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.top .sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.bad{color:var(--bad)}.btn.sm{padding:5px 9px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.login{max-width:380px;margin:12vh auto}.login input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:16px}.stats .card{padding:14px}.stats small{color:var(--mut);display:block}.stats b{font-size:1.5rem}
.stats button.card{font:inherit;color:inherit;text-align:left;cursor:pointer}.stats button.card:hover{border-color:var(--ac)}.stats button.card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac);background:#f0f7f4}
.count{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:.9rem;margin:0 0 10px}
details.more summary{list-style:none}details.more summary::-webkit-details-marker{display:none}details.more[open]{flex-basis:100%}details.more .acts{margin-top:6px}
.sub{color:var(--mut);font-size:.85rem;margin:-10px 0 14px}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.tools input,.tools select{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff}.tools input{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:.8rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td small{display:block;color:var(--mut)}td a{color:var(--ac);font-weight:600;text-decoration:none}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.8rem;font-weight:650}
.p-active{background:#dcfce7;color:#166534}.p-suspended{background:#fee2e2;color:#991b1b}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.msg{min-height:1.3em;color:var(--bad);margin:0}.pwg{display:grid;gap:10px}.pwg label{display:grid;gap:5px;font-weight:600;font-size:.9rem}.pwg input{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit}.empty{color:var(--mut);text-align:center;padding:30px}
@media (max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}table,tbody,tr,td{display:block}thead{display:none}tr{border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;padding:6px}td{border:0;padding:6px 8px}td[data-l]::before{content:attr(data-l);display:block;font-size:.72rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}.tools select{flex:1;min-width:140px}}
.ov{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;justify-content:flex-end;z-index:20}
.pane{background:var(--bg);width:min(980px,100%);height:100%;overflow:auto;padding:22px;box-shadow:-20px 0 40px -20px rgba(0,0,0,.4)}
.ro{display:inline-flex;gap:6px;align-items:center;background:#fef3c7;color:#92400e;border-radius:99px;padding:4px 11px;font-size:.8rem;font-weight:700}
.vt{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.vt button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;cursor:pointer}.vt button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}.kv .card{padding:12px}.kv small{color:var(--mut);display:block}.kv b{font-size:1.15rem}
.pane table{font-size:.9rem}.pane h3{margin:16px 0 8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s),P=window.PLAT||{name:'Platform'},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=sessionStorage.getItem('mt-admin')||'',shops=[],q='',f='all',srt='new',bz='all',tabA='shops',lim=50;
const fd=t=>t?new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const left=t=>{const d=Math.ceil((Date.parse(t)-Date.now())/864e5);return d>0?d+' day'+(d==1?'':'s')+' left':'ended '+(-d)+' day'+(d==-1?'':'s')+' ago'};
const LBL={active:'Open',suspended:'Paused'};
async function api(p,body){const r=await fetch('/api/platform/admin/'+p,{method:body?'POST':'GET',headers:Object.assign({Authorization:'Bearer '+tok},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(r.status==401){tok='';sessionStorage.removeItem('mt-admin');login();throw new Error(j.error)}if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}
function login(m){document.title=P.name+' · Admin';$('#app').innerHTML=`<div class="card login"><h1>${esc(P.name)} admin</h1><p style="color:var(--mut);margin:4px 0 0">Every shop on the platform. View any shop; pause or delete an account.</p><form onsubmit="event.preventDefault();doLogin()"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" autofocus><p class="msg" id="lm">${esc(m||'')}</p><button class="btn pri" style="width:100%;justify-content:center">Log in</button></form></div>`}
async function doLogin(){try{const r=await fetch('/api/platform/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);tok=j.token;sessionStorage.setItem('mt-admin',tok);load()}catch(e){$('#lm').textContent=e.message}}
/* ---------- withdrawal requests: shop owners asking for their money; pay within 24 hours ---------- */
let WDR=null;
const wdt=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const wdAcct=a=>a?[a.bank,a.number,a.name,a.branch].filter(Boolean).join(' · '):'no account';
const wdLeft=(at,H)=>{const h=Math.round((at+(H||24)*36e5-Date.now())/36e5);return h>0?'pay within '+h+' hour'+(h==1?'':'s'):'<b style="color:#b91c1c">'+(h==0?'due now':'late by '+(-h)+' hour'+(h==-1?'':'s'))+'</b>'};
function wdBox(){const c=WDR;if(!c)return '';if(c.err)return `<p class="msg">${esc(c.err)}</p>`;const L=c.open||[];document.title=(L.length?'('+L.length+') ':'')+P.name+' · Admin';
 if(!L.length)return '';
 return `<div class="card" style="margin-bottom:14px;border:2px solid #d97706"><b>🔔 Withdrawal requests (${L.length})</b><br><small style="color:var(--mut)">These shop owners asked for their money. Pay each one within ${c.hours||24} hours, then record the payout.</small>
 ${L.map(x=>`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--bd,#ddd);margin-top:10px;padding-top:10px"><div style="flex:1;min-width:230px"><b>${esc(x.name)}</b> · <b>${GH(x.amt)}</b><small style="display:block">Pay to: ${esc(wdAcct(x.acct))}</small><small style="display:block;color:var(--mut)">Asked ${wdt(x.at)}${x.by?' by '+esc(x.by):''}${x.phone?' · shop phone '+esc(x.phone):''} · ${wdLeft(x.at,c.hours)}</small></div><button class="btn sm pri" onclick="payouts('${esc(x.shop)}')">Pay / details</button></div>`).join('')}</div>`}
async function wdRefresh(){try{WDR=await api('withdrawals')}catch(e){WDR={err:e.message}}if(tok)draw()}
async function wdDecline(id){const note=prompt('Why can’t this request be paid? The shop owner gets this by SMS and can ask again.','');if(note===null)return;try{LG=await api('payout',{id:LG.shop.id,decline:id,note});ledgerPane();wdRefresh()}catch(e){alert(e.message)}}
// New requests show without pressing Refresh: checked once a minute while the page is open.
setInterval(()=>{if(!tok||document.hidden||!WDR)return;api('withdrawals').then(j=>{const ch=JSON.stringify(j.open)!==JSON.stringify(WDR.open||[]),a=document.activeElement;WDR=j;if(ch&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))&&!document.querySelector('details.more[open]'))draw()}).catch(()=>{})},60000);
const WDST={open:'Waiting',paid:'Paid',cancelled:'Cancelled by the shop',declined:'Not paid'};
/* ---------- shared payments: your Paystack, commission, payouts to shops ---------- */
let PAYC=null;
const GH=n=>'GH₵ '+Number(n||0).toFixed(2);
function payBox(){const c=PAYC;if(!c)return '';if(c.err)return `<p class="msg">${esc(c.err)}</p>`;const me=c.me||{};
 return `<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px"><b>💳 Shared payments · your Paystack</b><br><small style="color:var(--mut)">${c.ready?`Shops without their own Paystack key take Mobile Money and card payments into <b>your</b> Paystack account (${c.live?'LIVE, real money':'test key'}). You pay each shop out and keep your commission. ${c.on?((c.off||[]).length?(c.off||[]).length+' shop(s) switched off below.':'On for every shop.'):'Off: those shops take practice payments only.'}`:'Connect Paystack in Renatel Shop first (Online shop → Settings → Payments).'}</small></div>
 <label style="display:flex;gap:8px;align-items:center;font-weight:700">${c.on?'On':'Off'}<input type="checkbox" ${c.on?'checked':''} ${c.ready?'':'disabled'} onchange="paySet({on:this.checked})" style="width:22px;height:22px"></label></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px"><label style="font-size:.85rem">Commission for every shop (%)<br><input id="pc_pct" type="number" min="0" max="50" step="0.1" value="${esc(c.pct)}" style="width:110px"></label><button class="btn sm" onclick="paySet({pct:$('#pc_pct').value})">Save %</button><span style="flex:1"></span><button class="btn sm pri" onclick="dueAll()">💰 Money owed to shops</button><button class="btn sm" onclick="meForm()">My details</button></div>
 ${me.name?`<small style="color:var(--mut)">You: ${esc(me.name)}${me.phone?' · '+esc(me.phone):''}${me.email?' · '+esc(me.email):''}${me.number?' · pays from '+esc(me.bank||'')+' '+esc(me.number):''}</small>`:''}</div>`}
async function paySet(b){try{PAYC=await api('pay',b);draw()}catch(e){alert(e.message);load()}}
function ovOpen(h){const old=$('#ov');if(old)old.remove();const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML='<div class="pane">'+h+'</div>';document.body.appendChild(o);return o.querySelector('.pane')}
function meForm(){const m=(PAYC&&PAYC.me)||{},I=(id,l,v,ph)=>`<label style="display:block;margin-top:8px;font-size:.85rem">${l}<br><input id="${id}" value="${esc(v||'')}" placeholder="${ph||''}" style="width:100%"></label>`;
 ovOpen(`<div class="top"><h2>My details</h2><span class="sp"></span><button class="btn" onclick="$('#ov').remove()">Close</button></div><p style="color:var(--mut)">Shown to you on payouts. Your business, and the account you pay shops from.</p><div class="card" style="max-width:520px">
 ${I('me_n','Business name',m.name,'Renatel Shop')}${I('me_p','Phone',m.phone)}${I('me_e','Email',m.email)}
 <label style="display:block;margin-top:8px;font-size:.85rem">I pay shops by<br><select id="me_k"><option value="momo" ${m.kind!='bank'?'selected':''}>Mobile Money</option><option value="bank" ${m.kind=='bank'?'selected':''}>Bank</option></select></label>
 ${I('me_b','Network or bank',m.bank,'MTN MoMo')}${I('me_an','Account name',m.acctName)}${I('me_no','Account or MoMo number',m.number)}
 <p class="msg" id="me_m"></p><button class="btn pri" onclick="meSave()">Save</button></div>`)}
async function meSave(){const g=i=>$('#'+i).value.trim();try{PAYC=await api('pay',{me:{name:g('me_n'),phone:g('me_p'),email:g('me_e'),kind:g('me_k'),bank:g('me_b'),acctName:g('me_an'),number:g('me_no')}});$('#ov').remove();draw()}catch(e){$('#me_m').textContent=e.message}}
async function dueAll(){const p=ovOpen('<p>Loading…</p>');try{const j=await api('payouts');const L=j.shops.sort((a,b)=>b.due-a.due),T=k=>GH(L.reduce((a,x)=>a+x[k],0));
 p.innerHTML=`<div class="top"><h2>💰 Money owed to shops</h2><span class="sp"></span><button class="btn" onclick="$('#ov').remove()">Close</button></div>
 <div class="card" style="padding:4px 8px"><table><thead><tr><th>Shop</th><th>Paid online</th><th>Your commission</th><th>Shop's share</th><th>Paid out</th><th>Still owed</th><th></th></tr></thead><tbody>${L.map(s=>`<tr><td>${esc(s.name)}<small>${s.acct?esc(s.acct.bank+' · '+s.acct.number+' · '+s.acct.name):'⚠ no payout account yet'}</small></td><td>${GH(s.collected)}</td><td>${GH(s.fees)}</td><td>${GH(s.net)}</td><td>${GH(s.paid)}</td><td><b>${GH(s.due)}</b></td><td><button class="btn sm pri" onclick="payouts('${s.id}')">Pay / details</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No online payments through your account yet.</td></tr>'}
 ${L.length?`<tr><td><b>Total</b></td><td>${T('collected')}</td><td><b>${T('fees')}</b></td><td>${T('net')}</td><td>${T('paid')}</td><td><b>${T('due')}</b></td><td></td></tr>`:''}</tbody></table></div><p style="color:var(--mut);font-size:.85rem">Paystack also takes its own fee from each payment before it reaches your account; your commission is worked out on the full amount the customer paid.</p>`}catch(e){p.innerHTML='<p class="msg">'+esc(e.message)+'</p>'}}
let LG=null;
async function payouts(id){const p=ovOpen('<p>Loading…</p>');try{LG=await api('payouts?id='+encodeURIComponent(id));ledgerPane()}catch(e){p.innerHTML='<p class="msg">'+esc(e.message)+'</p>'}}
function ledgerPane(){const g=LG,s=g.shop,a=g.acct||{},rate=PAYC&&PAYC.rates&&PAYC.rates[s.id],stt=(l,v)=>`<div class="card"><small>${l}</small><b>${GH(v)}</b></div>`,I=(id,l,v,ph,t)=>`<label style="display:block;margin-top:6px;font-size:.85rem">${l}<br><input id="${id}" ${t?'type="'+t+'"':''} value="${esc(v==null?'':v)}" placeholder="${ph||''}" style="width:100%"></label>`;
 $('#ov .pane').innerHTML=`<div class="top"><h2>💳 ${esc(s.name)} · payments</h2><span class="sp"></span><button class="btn" onclick="dueAll()">All shops</button><button class="btn" onclick="$('#ov').remove()">Close</button></div>
 <div class="stats">${stt('Paid online',g.collected)}${stt('Your commission',g.fees)}${stt('Shop’s share',g.net)}${stt('Paid out',g.paid)}${stt('Still owed',g.due)}</div>
 ${g.open?`<div class="card" style="border:2px solid #d97706;margin-bottom:12px"><b>🔔 Withdrawal request · ${GH(g.open.amt)}</b><small style="display:block;margin-top:4px">Pay to: <b>${esc(wdAcct(g.open.acct))}</b></small><small style="display:block;color:var(--mut)">Asked ${wdt(g.open.at)}${g.open.by?' by '+esc(g.open.by):''} · ${wdLeft(g.open.at,g.wdHours)} (by ${wdt(g.open.at+(g.wdHours||24)*36e5)})</small><p style="font-size:.85rem;margin:8px 0">Send the money, then record the payout below. That closes the request and the owner gets an SMS.</p><button class="btn sm bad" onclick="wdDecline(${+g.open.id})">Can’t pay this request</button></div>`:''}
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">
 <div class="card"><b>Record a payout</b><p style="color:var(--mut);font-size:.85rem;margin:4px 0">Pay the shop first (MoMo or bank), then record it here. The shop owner gets an SMS.</p>
 ${g.open?`<label style="display:flex;gap:8px;align-items:center;font-size:.85rem;margin-top:6px"><input type="checkbox" id="po_wd" checked style="width:18px;height:18px">This pays the withdrawal request of ${GH(g.open.amt)}</label>`:''}
 ${I('po_a','Amount (GH₵)',g.open?(+g.open.amt).toFixed(2):g.due>0?g.due.toFixed(2):'','','number')}<label style="display:block;margin-top:6px;font-size:.85rem">Paid by<br><select id="po_m"><option>Mobile Money</option><option>Bank transfer</option><option>Cash</option><option>Other</option></select></label>${I('po_r','Transaction ID / reference','','e.g. MoMo transaction ID')}${I('po_n','Note (optional)','','e.g. sales 1–7 Nov')}
 <p class="msg" id="po_msg"></p><button class="btn pri" onclick="poSave(this)">Record payout</button></div>
 <div class="card"><b>Shop’s payout account</b>${g.acct?`<small style="color:var(--mut)">saved by ${esc(a.by||'')}</small>`:'<p class="msg" style="margin:4px 0">Not added yet. The shop owner adds it in Online shop → Settings → Payments, or you can add it here.</p>'}
 <label style="display:block;margin-top:6px;font-size:.85rem">Pay by<br><select id="pa_k"><option value="momo" ${a.kind!='bank'?'selected':''}>Mobile Money</option><option value="bank" ${a.kind=='bank'?'selected':''}>Bank</option></select></label>${I('pa_b','Network or bank',a.bank)}${I('pa_n','Account name',a.name)}${I('pa_no','Number',a.number)}${I('pa_br','Bank branch',a.branch)}
 <p class="msg" id="pa_msg"></p><button class="btn" onclick="paSave()">Save account</button>
 <hr style="border:0;border-top:1px solid var(--bd,#ddd);margin:14px 0"><b>Commission for this shop</b>${I('pr_r','% (empty = the default '+(PAYC?PAYC.pct:5)+'%)',rate==null?'':rate,'','number')}<button class="btn sm" style="margin-top:6px" onclick="rateSave()">Save</button><small style="display:block;color:var(--mut);margin-top:4px">Applies to new payments only.</small></div></div>
 <h3>Payouts</h3><div class="card" style="padding:4px 8px"><table><thead><tr><th>Date</th><th>Amount</th><th>How</th><th>Reference</th><th></th></tr></thead><tbody>${(g.payouts||[]).map(x=>`<tr><td>${fd(x.at)}</td><td><b>${GH(x.amt)}</b></td><td>${esc(x.method)}</td><td>${esc(x.ref)}${x.note?'<small>'+esc(x.note)+'</small>':''}</td><td><button class="btn sm bad" onclick="if(confirm('Remove this payout record?'))poDel(${x.id})">Remove</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No payouts yet.</td></tr>'}</tbody></table></div>
 <h3>Withdrawal requests</h3><div class="card" style="padding:4px 8px"><table><thead><tr><th>Asked</th><th>Amount</th><th>Pay to</th><th>Status</th></tr></thead><tbody>${(g.wd||[]).map(x=>`<tr><td>${wdt(x.at)}</td><td><b>${GH(x.amt)}</b></td><td>${esc(wdAcct(x.acct))}</td><td>${WDST[x.status]||esc(x.status)}${x.doneAt?'<small>'+wdt(x.doneAt)+'</small>':''}${x.note?'<small>'+esc(x.note)+'</small>':''}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No withdrawal requests yet.</td></tr>'}</tbody></table></div>
 <h3>Online payments</h3><div class="card" style="padding:4px 8px"><table><thead><tr><th>Paid</th><th>Receipt</th><th>Customer</th><th>Amount</th><th>Commission</th><th>Shop’s share</th></tr></thead><tbody>${(g.orders||[]).map(o=>`<tr><td>${fd(o.at)}</td><td>${o.sale?'#'+o.sale:''}<small>${esc(o.ref)}</small></td><td>${esc(o.name)}</td><td>${GH(o.total)}</td><td>${GH(o.fee)} <small>${o.pct}%</small></td><td>${GH(o.net)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No online payments yet.</td></tr>'}</tbody></table></div>`}
async function poSave(b){const g=i=>$('#'+i).value.trim(),m=$('#po_msg');const amt=+g('po_a');if(!(amt>0))return m.textContent='Enter the amount.';if(amt>LG.due+0.005&&!confirm('That is more than the '+GH(LG.due)+' still owed. Record it anyway?'))return;
 b.disabled=true;try{const wd=LG.open&&$('#po_wd')&&$('#po_wd').checked?LG.open.id:undefined;LG=await api('payout',{id:LG.shop.id,amt,method:g('po_m'),ref:g('po_r'),note:g('po_n'),wd});ledgerPane();wdRefresh()}catch(e){m.textContent=e.message;b.disabled=false}}
async function poDel(pid){try{LG=await api('payout',{id:LG.shop.id,del:pid});ledgerPane();wdRefresh()}catch(e){alert(e.message)}}
async function paSave(){const g=i=>$('#'+i).value.trim();try{LG=await api('payacct',{id:LG.shop.id,acct:{kind:g('pa_k'),bank:g('pa_b'),name:g('pa_n'),number:g('pa_no'),branch:g('pa_br')}});ledgerPane()}catch(e){$('#pa_msg').textContent=e.message}}
async function rateSave(){try{PAYC=await api('pay',{id:LG.shop.id,rate:$('#pr_r').value.trim()});alert('Saved.')}catch(e){alert(e.message)}}
let SMSC=null,NUDC=null,SMO=null;
async function load(){try{const j=await api('shops');shops=j.shops;try{SMSC=await api('sms')}catch(e){SMSC={err:e.message}}try{PAYC=await api('pay')}catch(e){PAYC={err:e.message}}try{WDR=await api('withdrawals')}catch(e){WDR={err:e.message}}try{NUDC=await api('nudge')}catch(e){NUDC={err:e.message}}try{SMO=await api('smsorders')}catch(e){SMO={err:e.message}}draw()}catch(e){if(tok)$('#app').innerHTML='<p class="msg">'+esc(e.message)+'</p>'}}
/* ---------- the shops list: what each shop is, how far it has got, filters and sorting ---------- */
const DAY=864e5,BIZ={retail:'Shop',pharmacy:'Pharmacy',restaurant:'Restaurant',school:'School',courier:'Delivery service'};
const ago=t=>{if(!t)return 'never';const m=Math.floor((Date.now()-t)/6e4);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+' hour'+(h==1?'':'s')+' ago';const d=Math.floor(h/24);return d+' day'+(d==1?'':'s')+' ago'};
const num=n=>(+n||0).toLocaleString('en-US'),amt=(c,n)=>(c||'')+' '+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
// How far a shop has got. Needs the shop details (s.st); '' when they could not be loaded.
function stage(s){const t=s.st;if(!t)return '';const used=t.sales>0||t.otherUse>0;if(!used)return t.products+t.students>0?'setup':'empty';return t.lastAct&&Date.now()-t.lastAct<7*DAY?'using':'quiet'}
const STG={using:['In use','#dcfce7','#166534'],setup:['Set up, not used yet','#fef3c7','#92400e'],empty:['Not started','#eef1f4','#475569'],quiet:['Gone quiet','#fee2e2','#991b1b']};
const day0=()=>new Date().setHours(0,0,0,0),born=s=>Date.parse(s.created)||0;
const FLT={all:['All shops',()=>true],today:['Joined today',s=>born(s)>=day0()],week:['Joined in the last 7 days',s=>born(s)>=Date.now()-7*DAY],using:['In use',s=>stage(s)=='using'],setup:['Set up, not used yet',s=>stage(s)=='setup'],empty:['Not started',s=>stage(s)=='empty'],quiet:['Gone quiet (7+ days)',s=>stage(s)=='quiet'],
 sold:['Has made a sale',s=>s.st&&s.st.sales>0],web:['Has online orders',s=>s.st&&s.st.webOrders>0],two:['Two branches',s=>s.st&&s.st.branches==2],note:['Has a note',s=>!!s.note],active:['Open',s=>s.plan=='active'],suspended:['Paused',s=>s.plan=='suspended']};
const lastAct=s=>(s.st&&s.st.lastAct)||0,sv=(s,k)=>(s.st&&+s.st[k])||0;
const SRT={new:['Newest first',(a,b)=>born(b)-born(a)],old:['Oldest first',(a,b)=>born(a)-born(b)],act:['Last active',(a,b)=>lastAct(b)-lastAct(a)||born(b)-born(a)],sales:['Most sales',(a,b)=>sv(b,'sales')-sv(a,'sales')||born(b)-born(a)],prod:['Most products',(a,b)=>sv(b,'products')-sv(a,'products')||born(b)-born(a)],name:['Name A to Z',(a,b)=>String(a.name).localeCompare(String(b.name))]};
function shownShops(){const v=q.trim().toLowerCase(),t=s=>s.st||{};
 return shops.filter(s=>(FLT[f]||FLT.all)[1](s)&&(bz=='all'||(t(s).biz||'retail')==bz)&&(!v||[s.name,s.slug,s.owner,s.email,s.phone,t(s).city,t(s).region,t(s).addr,s.note].join(' ').toLowerCase().includes(v))).sort((SRT[srt]||SRT.new)[1])}
function setF(k){f=k;tabA='shops';lim=50;draw()}

 const tile=(k,l)=>`<button class="card${f==k&&tabA=='shops'?' on':''}" onclick="setF('${k}')"><small>${l}</small><b>${n(k)}</b></button>`;

 if(tabA=='shops')drawList()}
// Only the list is redrawn while you type, so the search box keeps its place.

 el.innerHTML=`<p class="count"><span>Showing <b>${cut.length}</b> of ${L.length} shop${L.length==1?'':'s'}${on?' (out of '+shops.length+')':''} · ${SRT[srt][0].toLowerCase()}</span>${on?`<button class="btn sm" onclick="q='';f='all';bz='all';lim=50;draw()">Clear filters</button>`:''}</p>

function row(s){const t=s.st,g=stage(s),G=STG[g],place=t?[t.city,t.region].filter(Boolean).join(', '):'',nm=esc(String(s.name).replace(/['"\\]/g,''));

 <small>${t.sales?`${num(t.sales)} sale${t.sales==1?'':'s'} · ${esc(amt(t.cur,t.salesTotal))} · last sale ${ago(t.lastSale)}`:'No sales yet'}</small>
 ${t.webOrders?`<small>🛒 ${t.webOrders} online order${t.webOrders==1?'':'s'}, ${t.webPaid} paid</small>`:''}<small>${t.lastAct?'Last active '+ago(t.lastAct):'No activity yet'}</small>`;
 return `<tr><td><a href="/${esc(s.slug)}" target="_blank">${esc(s.name)}</a><small>/${esc(s.slug)}</small>${t?`<small>${esc(BIZ[t.biz]||t.biz)}${place?' · '+esc(place):''}</small>`:''}${s.note?`<small>📝 ${esc(s.note)}</small>`:''}</td>
 <td>${esc(s.owner)}<small>${esc(s.email)}</small><small>${s.phone?`<a href="tel:${esc(s.phone)}" style="font-weight:400">${esc(s.phone)}</a>`:'no phone'}</small></td>
 <td data-l="Activity">${act}</td><td data-l="Joined">${fd(s.created)}<small>${ago(born(s))}</small></td>

 ${L.length?`<div class="card" style="padding:4px 8px"><table><thead><tr><th>When</th><th>Shop</th><th>Stage</th><th>Result</th></tr></thead><tbody>${L.map(x=>`<tr><td>${new Date(x.ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(x.name)}</td><td>${NSTG[x.stage]||esc(x.stage)} · ${x.n}</td><td>${x.ok?'Sent':'Failed: '+esc(x.err||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nothing sent yet.</p>'}`)}
async function act(id,a,n){try{const j=await api('shop',{id,act:a,n});shops=shops.map(s=>s.id==id?Object.assign({},s,j.shop):s);draw()}catch(e){alert(e.message)}}
async function note(id){const s=shops.find(x=>x.id==id),v=prompt('Note for '+s.name+' (only you see it):',s.note||'');if(v!==null){const j=await api('shop',{id,act:'note',note:v});shops=shops.map(x=>x.id==id?Object.assign({},x,j.shop):x);draw()}}
function pwForm(){if($('#pwf'))return $('#pwf').remove();const d=document.createElement('div');d.id='pwf';d.className='card';d.style.cssText='max-width:440px;margin:0 0 16px';
 d.innerHTML=`<h2 style="margin:0 0 4px;font-size:1.15rem">Change admin password</h2><p style="color:var(--mut);margin:0 0 12px">Use at least 8 characters with letters and numbers. Other admin sessions are signed out.</p>
 <form onsubmit="event.preventDefault();pwSave()" class="pwg"><label>Current password<input id="pw_c" type="password" autocomplete="current-password"></label><label>New password<input id="pw_n" type="password" autocomplete="new-password"></label><label>Type the new password again<input id="pw_r" type="password" autocomplete="new-password"></label>
 <label style="flex-direction:row;display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" style="width:auto;margin:0" onchange="['pw_c','pw_n','pw_r'].forEach(i=>$('#'+i).type=this.checked?'text':'password')"> Show passwords</label>
 <p class="msg" id="pw_m"></p><div style="display:flex;gap:8px"><button class="btn pri" id="pw_b">Save new password</button><button type="button" class="btn" onclick="$('#pwf').remove()">Cancel</button></div></form>`;
 $('.top').after(d);$('#pw_c').focus()}
async function pwSave(){const c=$('#pw_c').value,n=$('#pw_n').value,r=$('#pw_r').value,m=$('#pw_m');m.style.color='var(--bad)';
 if(!c||!n)return m.textContent='Fill in your current and new password.';if(n!==r)return m.textContent='The two new passwords are not the same.';
 const b=$('#pw_b');b.disabled=true;b.textContent='Saving…';
 try{const j=await api('password',{current:c,password:n});tok=j.token;sessionStorage.setItem('mt-admin',tok);m.style.color='var(--ac)';m.textContent='✓ Password changed. Use the new password next time you log in.';b.textContent='Saved';setTimeout(()=>{const f=$('#pwf');if(f)f.remove()},2500)}
 catch(e){m.textContent=e.message;b.disabled=false;b.textContent='Save new password'}}
let V=null,vt='sum';
const money=n=>(V?V.cur:'')+' '+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),dt=t=>t?new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const ROLE={owner:'Owner',manager:'Manager',cashier:'Cashier',accountant:'Accountant',stock:'Stock keeper',warehouse:'Warehouse',delivery:'Delivery'};
async function view(id){const old=$('#ov');if(old)old.remove();const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML='<div class="pane"><p>Loading the shop…</p></div>';document.body.appendChild(o);
 try{V=await api('view?id='+encodeURIComponent(id));vt='sum';pane()}catch(e){o.querySelector('.pane').innerHTML='<p class="msg">'+esc(e.message)+'</p>'}}
function pane(){const v=V,s=v.shop,D=v.details||{},L=shops.find(x=>x.id==s.id)||{},t=L.st,T=(h,rows)=>`<div class="card" style="padding:4px 8px"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${h.length}" class="empty">Nothing yet.</td></tr>`}</tbody></table></div>`;
 const tabs=[['sum','Summary'],['staff','Staff ('+v.staff.length+')'],['prod','Products ('+v.products.length+')'],['sales','Recent sales'],['log','Activity']];
 let body='';
 if(vt=='sum')body=`<div class="kv"><div class="card"><small>Owner</small><b>${esc(s.owner)}</b><small>${esc(s.email)}${s.phone?' · '+esc(s.phone):''}</small></div><div class="card"><small>Shop link</small><b>/${esc(s.slug)}</b><small>Started ${fd(s.created)}</small></div><div class="card"><small>Status</small><b>${LBL[s.plan]}</b><small>${v.branches.length} branch${v.branches.length>1?'es':''} · ${v.warehouse} warehouse items</small></div>
  <div class="card"><small>Type of business</small><b>${esc(BIZ[D.biz]||D.biz||'Shop')}</b><small>${esc([D.addr,D.city,D.region].filter(Boolean).join(', ')||'No address added')}</small></div>
  <div class="card"><small>Shop contact</small><b>${esc(D.phone||'No phone')}</b><small>${esc(D.email||'No shop email')}</small></div>
  ${t?`<div class="card"><small>Progress</small><b>${STG[stage(L)][0]}</b><small>${t.lastAct?'Last active '+ago(t.lastAct):'No activity yet'}${t.lastSale?' · last sale '+ago(t.lastSale):''}</small></div><div class="card"><small>Online shop</small><b>${D.store?'Open':'Not open'}</b><small>${t.webOrders} online order${t.webOrders==1?'':'s'}, ${t.webPaid} paid</small></div>`:''}</div>`+
  v.branches.map(b=>`<h3>📍 ${esc(b.name)}</h3><div class="kv"><div class="card"><small>Sales today</small><b>${money(b.today.total)}</b><small>${b.today.n} sales</small></div><div class="card"><small>Sales this month</small><b>${money(b.month.total)}</b><small>${b.month.n} sales · expenses ${money(b.month.expenses)}</small></div><div class="card"><small>All sales</small><b>${money(b.all.total)}</b><small>${b.all.n} sales</small></div><div class="card"><small>Products</small><b>${b.products}</b><small>${b.units} units · ${b.low} low</small></div><div class="card"><small>Customers</small><b>${b.customers}</b></div></div>`).join('');
 if(vt=='staff')body=T(['Name','Position','Branch','Email','Phone'],v.staff.map(x=>`<tr><td>${esc(x.name)}${x.locked?' <span class="pill p-suspended">Locked</span>':''}</td><td>${esc(ROLE[x.role]||x.role)}</td><td>${esc(x.branch)}</td><td>${esc(x.email||'—')}</td><td>${esc(x.phone||'—')}</td></tr>`));
 if(vt=='prod')body=T(['Product','Category','Branch','Price','Stock'],v.products.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cat||'—')}</td><td>${esc(x.b)}</td><td>${money(x.price)}</td><td>${esc(x.stock??0)}</td></tr>`));
 if(vt=='sales')body=T(['Time','Receipt','Branch','Items','Paid by','Sold by','Total'],v.sales.map(x=>`<tr><td>${dt(x.ts)}</td><td>#${esc(x.id)}</td><td>${esc(x.b)}</td><td>${esc(x.items)}</td><td>${esc(x.method||'')}</td><td>${esc(x.by)}</td><td><b>${money(x.total)}</b></td></tr>`));
 if(vt=='log')body=T(['Time','Who','What','Details'],v.log.map(x=>`<tr><td>${dt(x.ts)}</td><td>${esc(x.who)}</td><td>${esc(x.a)}</td><td>${esc(x.d)}</td></tr>`));
 $('#ov .pane').innerHTML=`<div class="top" style="margin:0"><h1>${esc(s.name)}</h1><span class="ro">👁 View only</span><span class="sp"></span><button class="btn" onclick="$('#ov').remove()">Close</button></div>
 <p style="color:var(--mut);margin:6px 0 0">You can see this shop's data but not change it. You can only pause or delete the account.</p>
 <div class="vt">${tabs.map(([k,l])=>`<button class="${vt==k?'on':''}" onclick="vt='${k}';pane()">${l}</button>`).join('')}</div>${body}
 <div style="display:flex;gap:8px;margin-top:18px">${s.plan=='suspended'?`<button class="btn" onclick="act('${s.id}','activate').then(()=>view('${s.id}'))">Open again</button>`:`<button class="btn bad" onclick="if(confirm('Pause ${esc(String(s.name).replace(/['"\\]/g,''))}? Nobody can log in until you open it again. Data is kept.'))act('${s.id}','suspend').then(()=>{$('#ov').remove();view('${s.id}')})">Pause (hold) account</button>`}<button class="btn bad" onclick="del('${s.id}')">Delete account</button></div>`}
async function del(id){const s=shops.find(x=>x.id==id);const v=prompt('Delete '+s.name+' for good?\n\nThis removes the shop, its staff, products, sales and backups. It cannot be undone.\n\nType the shop link to confirm: '+s.slug);if(v===null)return;
 try{await api('shop',{id,act:'delete',confirm:v});shops=shops.filter(x=>x.id!=id);const o=$('#ov');if(o)o.remove();draw();alert(s.name+' was deleted.')}catch(e){alert(e.message)}}
tok?load():login();
</script>
</body>
</html>
