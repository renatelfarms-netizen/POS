/* ---------- login screen (modern) ---------- */

  if(mode=='add'&&le&&phExpd(le)&&!await uiConfirm('That expiry date has already passed. This stock will not be sold. Add it anyway?','Add anyway',false))return;
  lotsFix(p);const L=JSON.parse(JSON.stringify(p.lots||[]));_sks.apply(this,arguments);const d=p.stock-before;if(!d)return;
  if(d>0){const m=L.find(l=>l.b==lb&&l.exp==le);if(m)m.q+=d;else L.push({b:lb,exp:le,q:d})}else lotTake(L,-d,rsn=='Expired');
  p.lots=L.filter(l=>l.q>0);lotsFix(p);save();render()};
 const _co=checkout;checkout=async function(){if(!PH())return _co.apply(this,arguments);
  cart.forEach(l=>lotsFix(prod(l.id)));const bad=cart.map(l=>({l,p:prod(l.id)})).filter(x=>x.p&&!x.p.svc&&x.l.qty>phQ(x.p));
  if(bad.length)return uiAlert('Expired stock can’t be sold:\n'+bad.map(x=>'• '+x.p.name+': only '+phQ(x.p)+' in date').join('\n')+'\n\nLower the quantity or remove the item.');
  const rx=cart.map(l=>prod(l.id)).filter(p=>p&&p.rx);
  if(rx.length&&!await uiConfirm('℞ Prescription-only: '+rx.map(p=>p.name).join(', ')+'\n\nHave you seen a valid prescription for this sale?','Yes, prescription seen',false))return;
  const plan={};cart.forEach(l=>{const p=prod(l.id);if(p&&!p.svc){const L=JSON.parse(JSON.stringify(p.lots||[]));plan[l.id]={L,a:lotTake(L,l.qty,false,true)}}});
  const n0=db.sales.length;_co.apply(this,arguments);if(db.sales.length<=n0)return;const s=db.sales[db.sales.length-1];
  s.items.forEach(i=>{const x=plan[i.id],p=prod(i.id);if(!x||!p)return;const a=x.a.filter(z=>z.b||z.exp);if(a.length)i.lots=a;p.lots=x.L.filter(l=>l.q>0);lotsFix(p)});if(rx.length)s.rx=1;save();render()};
})();

render();
