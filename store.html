<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop online</title>
<meta name="theme-color" content="#0b7a4b">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b7a4b;--g2:#08643d;--gl:#e7f4ee;--y:#ffc61a;--yd:#f5b800;--ink:#1b1f1d;--mut:#6e7571;--line:#ebedeb;--soft:#f4f5f3;--card:#fff;--bad:#c62828;--r:16px;--sh:0 2px 10px rgba(16,24,20,.05)}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth}
body{background:#fff;color:var(--ink);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.g{color:var(--g)}

/* top bar */
.nav{background:var(--g);color:#fff;position:sticky;top:0;z-index:20}
.nav .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:9px;background:#fff;display:grid;place-items:center;font-style:normal;font-size:17px}
.catbtn{background:var(--y);color:var(--ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.links{display:flex;gap:22px;font-size:14px;margin-left:8px}.links a{text-decoration:none;opacity:.92}.links a:hover{opacity:1;text-decoration:underline}
.sp{flex:1}
.cartbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.cartbtn .n{background:var(--y);color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
@media (max-width:820px){.links{display:none}}
@media (max-width:520px){.catbtn span{display:none}.logo b{max-width:42vw;overflow:hidden;text-overflow:ellipsis}}
.test{background:#fff6d6;color:#6b4a00;font-size:13px;padding:8px 0;border-bottom:1px solid #f3df9a}

/* hero */
.hero{background:linear-gradient(180deg,#f6f7f4,#eef1ec);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding-top:46px;padding-bottom:46px}
.tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px 6px 6px;font-size:13px;font-weight:500;box-shadow:var(--sh)}
.tag i{width:24px;height:24px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-style:normal;font-size:13px}
h1{font-size:clamp(30px,4.6vw,48px);line-height:1.15;margin:18px 0 12px;font-weight:700;letter-spacing:-.5px}
.lead{color:var(--mut);max-width:460px;margin:0 0 22px}
.cta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pill{background:var(--g);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.pill:hover{background:var(--g2)}
.pill.sm{padding:9px 18px;font-size:13px}
.ulink{font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;background:none;border:0;padding:0}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px;font-size:13px;color:var(--mut)}
.trust span{display:flex;gap:8px;align-items:center}.trust b{color:var(--ink);font-weight:600}
.trust i{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;box-shadow:var(--sh)}
.art{position:relative;aspect-ratio:1;max-width:420px;justify-self:center;width:100%}
.art .disc{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#e3f2ea 55%,#cfe8db 100%)}
.art .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed #cfe0d6}
.art .bag{position:absolute;inset:24%;border-radius:32px;background:var(--g);display:grid;place-items:center;font-size:clamp(64px,10vw,104px);box-shadow:0 24px 40px rgba(11,122,75,.25);transform:rotate(-6deg)}
.art .bub{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.chipf{position:absolute;background:#fff;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.09)}
.chipf i{width:24px;height:24px;border-radius:7px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-top:30px}.art{max-width:300px;order:-1}}

/* sections */
section{padding:56px 0;scroll-margin-top:62px}
.eyebrow{font-size:13px;color:var(--mut);margin:0}
h2{font-size:clamp(24px,3vw,32px);margin:2px 0 0;font-weight:700;letter-spacing:-.3px}
.center{text-align:center}
.cats{display:flex;gap:22px;overflow-x:auto;padding:28px 2px 6px;justify-content:center;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
@media (max-width:820px){.cats{justify-content:flex-start}}
.cat{flex:0 0 auto;width:92px;text-align:center;cursor:pointer;background:none;border:0;padding:0}
.cat .c{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:34px;transition:.15s;border:2px solid transparent}
.cat:hover .c{transform:translateY(-3px)}
.cat.on .c{background:var(--gl);border-color:var(--g)}
.cat b{display:block;font-size:13px;font-weight:600;line-height:1.25}.cat small{color:var(--mut);font-size:11px}
.promos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
@media (max-width:820px){.promos{grid-template-columns:1fr}}
.promo{border-radius:var(--r);padding:28px;position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;align-items:flex-start;background:var(--soft)}
.promo.y{background:var(--y)}
.promo .bdg{background:var(--y);border-radius:999px;font-size:12px;font-weight:600;padding:4px 12px}
.promo.y .bdg{background:#fff}
.promo h3{font-size:24px;line-height:1.2;margin:12px 0 6px;max-width:62%;font-weight:700}
.promo p{margin:0 0 16px;font-size:13px;color:#4d5450;max-width:58%}
.promo.y p{color:#5a4700}
.promo .big{position:absolute;right:-6px;bottom:-14px;font-size:120px;line-height:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.12))}
.prods{background:var(--soft)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 6px 4px 16px;box-shadow:var(--sh);min-width:260px}
.search input{border:0;outline:0;background:none;padding:8px 0;flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.p{background:var(--card);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;box-shadow:var(--sh);transition:.15s}
.p:hover{box-shadow:0 10px 26px rgba(16,24,20,.09)}
.pimg{position:relative;aspect-ratio:1.15;border-radius:12px;display:grid;place-items:center;font-size:clamp(48px,7vw,66px)}
.badge{position:absolute;top:8px;left:8px;background:var(--g);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px}
.badge.low{background:var(--y);color:var(--ink)}.badge.out{background:#9aa19d}
.pcat{color:var(--g);font-size:12px;margin-top:10px}
.pn{font-weight:600;font-size:15px;line-height:1.3;margin:1px 0}
.pu{color:var(--mut);font-size:12px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.price{font-weight:700;font-size:16px}
.add{background:var(--gl);color:var(--g);border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.add:hover{background:var(--g);color:#fff}
.add svg{width:14px;height:14px}
.qty{display:flex;align-items:center;gap:4px;background:var(--gl);border-radius:999px;padding:3px}
.qty button{width:28px;height:28px;border-radius:50%;border:0;background:#fff;color:var(--g);font-size:16px;font-weight:700;cursor:pointer}
.qty button:disabled{opacity:.4}
.qty span{min-width:20px;text-align:center;font-weight:600;font-size:13px}
.empty{background:#fff;border-radius:var(--r);padding:30px;text-align:center;grid-column:1/-1}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
@media (max-width:820px){.how{grid-template-columns:1fr}}
.step{background:var(--soft);border-radius:var(--r);padding:22px}
.step i{width:44px;height:44px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px;margin-bottom:12px}
.step b{display:block;font-size:16px;margin-bottom:4px}.step p{margin:0;color:var(--mut);font-size:14px}
footer{background:#0d2a1e;color:#cfe0d7;padding:36px 0;font-size:14px}
footer b{color:#fff}

/* checkout, payment, receipt */
.page{padding:28px 0 60px;background:var(--soft);min-height:70vh}
.box{background:#fff;border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.lbl{display:block;font-size:13px;color:var(--mut);margin:14px 0 5px;font-weight:500}
input.f,textarea.f{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--gl)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.seg input{margin-top:5px;accent-color:var(--g)}
.seg label:has(input:checked){border-color:var(--g);background:var(--gl)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:700;padding-top:12px}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.big{width:100%;justify-content:center;padding:14px;font-size:16px}
.pill:disabled{opacity:.55;cursor:not-allowed}
.msg{min-height:20px;font-size:14px;color:var(--bad);margin:10px 0 0}
.mut{color:var(--mut)}
.narrow{max-width:500px;margin:0 auto}
.paybox{border:2px dashed #e7c24d;background:#fffbea}
.bigic{font-size:54px;text-align:center}
.spin{width:30px;height:30px;border:3px solid var(--gl);border-top-color:var(--g);border-radius:50%;animation:s 1s linear infinite;margin:60px auto}
@keyframes s{to{transform:rotate(1turn)}}
.drawer{position:fixed;inset:0;background:rgba(10,20,15,.45);display:none;z-index:30}
.drawer.on{display:block}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
 <a class="logo" href="/store"><i>🛍️</i><b id="shopname">Shop online</b></a>
 <button class="catbtn" id="catbtn" onclick="goCats()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Browse All Categories</span></button>
 <nav class="links" id="links"><a href="/store">Home</a><a href="/store#products">Shop</a><a href="/store#how">How it works</a><a id="calllink" href="#">Contact</a></nav>
 <span class="sp"></span>
 <button class="cartbtn" id="cartbtn" onclick="openCart()" aria-label="Open cart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Cart <span class="n" id="cartn">0</span></button>
</div></header>
<div class="test" id="testbar" hidden><div class="wrap">🧪 <b>Test mode:</b> payments are simulated and no money is taken, but orders are recorded in the shop and stock really goes down.</div></div>
<main id="app"><div class="spin"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="drawer" id="drawer" onclick="if(event.target==this)closeCart()"><div class="pane" id="pane"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={products:[],cur:'GH₵',mode:'test'},cart={},cat='',q='',step='shop',ck={name:'',phone:'',email:'',mode:'pickup',addr:'',city:'',note:''};
try{cart=JSON.parse(sessionStorage.getItem('rs-cart')||'{}')||{}}catch(e){cart={}}
const keep=()=>{try{sessionStorage.setItem('rs-cart',JSON.stringify(cart))}catch(e){}};
const money=n=>S.cur+' '+Number(n||0).toFixed(2);
const P=id=>S.products.find(p=>p.id==id);
const BAG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>';
// An icon and soft colour for each category, picked from words in its name.
const ICONS=[[/fish|aqua|tank|pet|coral/i,'🐠'],[/medic|drug|pharm|treat|health/i,'💊'],[/feed|food|snack|provision|grain|rice/i,'🥫'],[/drink|water|juice|bever/i,'🥤'],[/fruit/i,'🍎'],[/veg|plant|seed|grow|garden|farm/i,'🌱'],[/egg|poultry|chick/i,'🥚'],[/milk|dairy/i,'🥛'],[/bak|bread/i,'🥖'],[/toilet|soap|clean|house/i,'🧴'],[/station|book|pen/i,'📒'],[/phone|access/i,'📱'],[/electr|light|pump|filter/i,'🔌'],[/cloth|wear|fashion/i,'👕'],[/tool|equip/i,'🧰'],[/test/i,'🧪']];
const icon=c=>{for(const [rx,e] of ICONS)if(rx.test(c||''))return e;return '🛍️'};
const TINTS=['#eaf6ef','#fff4d4','#e8f1fb','#fdeceb','#f1ecfb','#e9f6f6','#fbefe3'];
const tint=s=>TINTS[[...String(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)%TINTS.length];
const lines=()=>Object.entries(cart).map(([id,n])=>({p:P(id),n})).filter(x=>x.p&&x.n>0);
const total=()=>lines().reduce((t,x)=>t+x.p.price*x.n,0);
async function call(u,o){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o||{}));let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Something went wrong. Try again.');return j}

async function load(){try{const j=await call('/api/store/info');S=j;document.title=j.name+' · Shop online';$('#shopname').textContent=j.name;
  $('#testbar').hidden=j.mode!='test';
  if(j.phone)$('#calllink').href='tel:'+j.phone.replace(/[^\d+]/g,'');else $('#calllink').hidden=true;
  $('#foot').innerHTML=`<b>${esc(j.name)}</b>${j.addr||j.city?' · '+esc([j.addr,j.city].filter(Boolean).join(', ')):''}${j.phone?' · <a href="tel:'+esc(j.phone.replace(/[^\d+]/g,''))+'">'+esc(j.phone)+'</a>':''}<br><span style="opacity:.75">Pay securely with Mobile Money or card${j.mode=='paystack-test'?' · Paystack test mode':''}.</span>`;
  Object.keys(cart).forEach(id=>{const p=P(id);if(!p)delete cart[id];else cart[id]=Math.min(cart[id],p.left)});keep()}
 catch(e){$('#app').innerHTML=`<div class="page"><div class="wrap narrow box"><b>The shop can’t be reached</b><p class="mut">${esc(e.message)}</p><button class="pill" onclick="location.reload()">Try again</button></div></div>`;throw e}}

function catList(){const m={};S.products.forEach(p=>{const c=p.cat||'Other';m[c]=(m[c]||0)+1});return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]))}
function goCats(){if(step!='shop'){step='shop';render()}setTimeout(()=>{const e=$('#cats');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},30)}
function pickCat(c){cat=c;$('#catrow').innerHTML=catRow();$('#grid').innerHTML=cards();$('#products').scrollIntoView({behavior:'smooth',block:'start'})}
function catRow(){const L=catList();return `<button class="cat ${cat?'':'on'}" onclick="pickCat('')"><div class="c">🛒</div><b>All</b><small>${S.products.length} product${S.products.length==1?'':'s'}</small></button>`+L.map(([c,n])=>`<button class="cat ${c==cat?'on':''}" onclick='pickCat(${esc(JSON.stringify(c))})'><div class="c">${icon(c)}</div><b>${esc(c)}</b><small>${n} product${n==1?'':'s'}</small></button>`).join('')}

function shopView(){const city=S.city||'Kumasi',ex=[...new Set(S.products.map(p=>icon(p.cat)))].concat(['🛍️','📦','🚚','💳']).slice(0,4);
 return `<section class="hero" style="padding:0"><div class="wrap">
  <div><span class="tag"><i>🏪</i>${esc(S.name)} · Official online store</span>
   <h1>Your One-Stop Shop<br>for <span class="g">Quality Products</span></h1>
   <p class="lead">Order online, pay safely with Mobile Money or card, then pick up at the shop in ${esc(city)} or have it delivered to you.</p>
   <div class="cta"><a class="pill" href="#products">Shop Now <span>→</span></a><button class="ulink" onclick="goCats()">Browse categories</button></div>
   <div class="trust"><span><i>🔒</i><span><b>Secure</b><br>payment</span></span><span><i>📱</i><span><b>MoMo</b><br>& card</span></span><span><i>🚚</i><span><b>Pickup</b><br>or delivery</span></span></div></div>
  <div class="art" aria-hidden="true"><div class="ring"></div><div class="disc"></div><div class="bag">🛍️</div>
   <div class="bub" style="top:4%;left:14%">${ex[0]}</div><div class="bub" style="top:16%;right:2%">${ex[1]}</div><div class="bub" style="bottom:8%;left:4%">${ex[2]}</div><div class="bub" style="bottom:2%;right:22%">${ex[3]}</div>
   <div class="chipf" style="top:40%;right:-2%"><i>✓</i>Secure Payment</div><div class="chipf" style="bottom:26%;left:-4%"><i>🚚</i>Fast Delivery</div></div>
 </div></section>
 <section id="cats"><div class="wrap"><p class="eyebrow center">Categories</p><h2 class="center">Featured <span class="g">Categories</span></h2>
  <div class="cats" id="catrow">${catRow()}</div>
  <div class="promos">
   <div class="promo"><span class="bdg">Pay your way</span><h3>Mobile Money or Card</h3><p>MTN MoMo, Telecel Cash, AirtelTigo Money and bank cards. Paid instantly and safely.</p><a class="pill sm" href="#products">Shop Now →</a><span class="big">📱</span></div>
   <div class="promo y"><span class="bdg">Pickup or delivery</span><h3>Collect in ${esc(city)} or Get it Delivered</h3><p>Choose at checkout. For delivery we call you to arrange the time.</p><a class="pill sm" href="#products">Shop Now →</a><span class="big">🚚</span></div>
  </div></div></section>
 <section class="prods" id="products"><div class="wrap"><div class="phead"><div><p class="eyebrow">Products</p><h2>Featured <span class="g">Products</span></h2></div>
  <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6e7571" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search products" value="${esc(q)}" oninput="q=this.value;$('#grid').innerHTML=cards()" aria-label="Search products"></label></div>
  <div class="grid" id="grid">${cards()}</div></div></section>
 <section id="how"><div class="wrap"><p class="eyebrow center">Simple & safe</p><h2 class="center">How it <span class="g">works</span></h2>
  <div class="how"><div class="step"><i>🛒</i><b>1. Pick your products</b><p>Add what you need to the cart. Stock is live from the shop.</p></div>
  <div class="step"><i>💳</i><b>2. Pay online</b><p>Pay with Mobile Money or card. You get a receipt number straight away.</p></div>
  <div class="step"><i>📦</i><b>3. Pick up or receive</b><p>Collect at the shop with your order number, or we deliver to you.</p></div></div></div></section>`}
function cards(){const L=S.products.filter(p=>(!cat||(p.cat||'Other')==cat)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
 if(!S.products.length)return `<div class="empty"><b>Nothing for sale online yet.</b><p class="mut">Check back soon.</p></div>`;
 if(!L.length)return `<div class="empty"><b>No products match.</b><p class="mut"><button class="ulink" onclick="q='';cat='';render()">Show all products</button></p></div>`;
 return L.map(p=>{const n=cart[p.id]||0,out=p.left<=0,low=!out&&p.left<=5;
  return `<div class="p"><div class="pimg" style="background:${tint(p.cat||p.name)}">${icon(p.cat||p.name)}<span class="badge ${out?'out':low?'low':''}">${out?'Sold out':low?'Only '+p.left+' left':'In stock'}</span></div>
  <span class="pcat">${esc(p.cat||'General')}</span><span class="pn">${esc(p.name)}</span><span class="pu">Per ${esc(p.unit||'pcs')}</span>
  <div class="pfoot"><span class="price">${money(p.price)}</span>${out?'':n?`<div class="qty"><button onclick="add(${p.id},-1)" aria-label="One less">−</button><span>${n}</span><button onclick="add(${p.id},1)" aria-label="One more" ${n>=p.left?'disabled':''}>+</button></div>`:`<button class="add" onclick="add(${p.id},1)">${BAG}Add</button>`}</div></div>`}).join('')}
function add(id,d){const p=P(id);if(!p)return;const n=Math.max(0,Math.min(p.left,(cart[id]||0)+d));if(n)cart[id]=n;else delete cart[id];keep();badge();if(step=='shop'){const g=$('#grid');if(g)g.innerHTML=cards()}if($('#drawer').classList.contains('on'))cartPane();if(step=='checkout')render()}
function badge(){$('#cartn').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function openCart(){cartPane();$('#drawer').classList.add('on')}
function closeCart(){$('#drawer').classList.remove('on')}
function cartPane(){const L=lines();$('#pane').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:20px">Your cart</b><button class="btn" onclick="closeCart()">Close</button></div>
 ${L.length?`<div>${L.map(x=>`<div class="row"><div style="display:flex;gap:10px;align-items:center"><div class="pimg" style="width:52px;aspect-ratio:1;font-size:26px;background:${tint(x.p.cat||x.p.name)}">${icon(x.p.cat||x.p.name)}</div><div><b style="font-size:14px">${esc(x.p.name)}</b><br><small class="mut">${money(x.p.price)} each</small></div></div><div style="text-align:right"><div class="qty"><button onclick="add(${x.p.id},-1)">−</button><span>${x.n}</span><button onclick="add(${x.p.id},1)" ${x.n>=x.p.left?'disabled':''}>+</button></div><small>${money(x.p.price*x.n)}</small></div></div>`).join('')}
 <div class="tot"><span>Total</span><span>${money(total())}</span></div></div><button class="pill big" onclick="closeCart();step='checkout';render();scrollTo(0,0)">Checkout →</button>`:'<div class="empty" style="background:var(--soft)"><div style="font-size:40px">🛒</div><b>Your cart is empty</b><p class="mut">Add products to get started.</p></div>'}`}

function checkoutView(){const L=lines();if(!L.length){step='shop';return shopView()}
 const V=(k,t,ph,ac)=>`<input class="f" id="f_${k}" type="${t||'text'}" value="${esc(ck[k])}" placeholder="${ph||''}" autocomplete="${ac||'off'}" oninput="ck.${k}=this.value">`;
 return `<div class="page"><div class="wrap"><button class="btn" onclick="step='shop';render()" style="margin-bottom:16px">← Keep shopping</button><h2 style="margin:0 0 16px">Checkout</h2>
 <div class="two"><div class="box"><b style="font-size:18px">Your details</b>
  <label class="lbl">Full name *</label>${V('name','text','e.g. Ama Mensah','name')}
  <label class="lbl">Phone number (MoMo) *</label>${V('phone','tel','024 000 0000','tel')}
  <label class="lbl">Email (for your receipt, optional)</label>${V('email','email','you@example.com','email')}
  <label class="lbl">How do you want it?</label>
  <div class="seg"><label><input type="radio" name="dm" value="pickup" ${ck.mode=='pickup'?'checked':''} onchange="ck.mode='pickup';render()"><span><b>Pick up</b><br><small class="mut">Collect at the shop${S.city?' in '+esc(S.city):''}</small></span></label>
  <label><input type="radio" name="dm" value="delivery" ${ck.mode=='delivery'?'checked':''} onchange="ck.mode='delivery';render()"><span><b>Delivery</b><br><small class="mut">We call you to arrange it</small></span></label></div>
  ${ck.mode=='delivery'?`<label class="lbl">Delivery address or landmark *</label>${V('addr','text','House no., street, landmark','street-address')}<label class="lbl">Town / city</label>${V('city','text','e.g. Kumasi')}<p class="mut" style="font-size:13px;margin:8px 0 0">Any delivery fee is agreed with you on the phone.</p>`:''}
  <label class="lbl">Note (optional)</label><textarea class="f" id="f_note" rows="2" oninput="ck.note=this.value">${esc(ck.note)}</textarea>
 </div>
 <div class="box"><b style="font-size:18px">Order summary</b>${L.map(x=>`<div class="row"><span>${x.n} × ${esc(x.p.name)}</span><b>${money(x.p.price*x.n)}</b></div>`).join('')}
  <div class="tot"><span>Total</span><span>${money(total())}</span></div>
  <p id="cmsg" class="msg" role="status" aria-live="polite"></p>
  <button class="pill big" id="paybtn" onclick="placeOrder()">Pay ${money(total())}</button>
  <p class="mut" style="font-size:13px;margin:12px 0 0;text-align:center">🔒 ${S.mode=='test'?'Test mode: you’ll see a practice payment screen. No money is taken.':'You’ll pay securely on Paystack with Mobile Money or card.'}</p></div></div></div></div>`}
async function placeOrder(){const b=$('#paybtn'),m=$('#cmsg');m.textContent='';
 ['name','phone','email','addr','city','note'].forEach(k=>{const e=$('#f_'+k);if(e)ck[k]=e.value});
 if(!ck.name.trim())return m.textContent='Enter your name.';if(ck.phone.replace(/\D/g,'').length<10)return m.textContent='Enter a valid phone number.';
 if(ck.mode=='delivery'&&!ck.addr.trim())return m.textContent='Enter the delivery address.';
 b.disabled=true;b.textContent='Please wait…';
 try{const j=await call('/api/store/order',{method:'POST',body:JSON.stringify(Object.assign({},ck,{items:lines().map(x=>({id:x.p.id,qty:x.n}))}))});location.href=j.pay_url}
 catch(e){m.textContent=e.message;b.disabled=false;b.textContent='Pay '+money(total());load().then(()=>{badge()}).catch(()=>{})}}

const shell=h=>`<div class="page"><div class="wrap narrow">${h}</div></div>`;
async function payView(ref){$('#app').innerHTML='<div class="spin"></div>';let o;try{o=await call('/api/store/order/'+ref)}catch(e){return $('#app').innerHTML=shell(`<div class="box"><b>Order not found</b><p class="mut">${esc(e.message)}</p><a class="pill" href="/store">Back to the shop</a></div>`)}
 if(o.status!='pending')return doneView(ref,o);
 $('#app').innerHTML=shell(`<div class="box paybox"><b style="font-size:19px">🧪 Test payment</b><p class="mut" style="margin:4px 0 12px">This screen stands in for Paystack while the shop is in test mode. No money is taken.</p>
  ${o.items.map(i=>`<div class="row"><span>${i.qty} × ${esc(i.name)}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}<div class="tot"><span>Amount</span><span>${money(o.total)}</span></div>
  <p class="mut" style="font-size:13px">Order ${esc(ref)} · ${esc(o.name)}</p>
  <p id="pmsg" class="msg"></p>
  <button class="pill big" id="okb" onclick="testPay('${ref}',true)">✔ Simulate successful MoMo payment</button>
  <button class="btn big" style="margin-top:10px" onclick="testPay('${ref}',false)">✖ Simulate failed payment</button></div>`)}
async function testPay(ref,ok){const b=$('#okb');b.disabled=true;b.textContent='Processing…';
 try{const o=await call('/api/store/testpay',{method:'POST',body:JSON.stringify({ref,ok})});if(!ok){$('#pmsg').textContent='Payment failed (test). Nothing was charged and no stock was taken. You can try again.';b.disabled=false;b.textContent='✔ Simulate successful MoMo payment';return}doneView(ref,o)}
 catch(e){$('#pmsg').textContent=e.message;b.disabled=false;b.textContent='✔ Simulate successful MoMo payment'}}

async function doneView(ref,o){$('#cartbtn').hidden=false;if(!o){$('#app').innerHTML='<div class="spin"></div><p class="mut" style="text-align:center">Checking your payment…</p>';
  for(let i=0;i<6;i++){try{o=await call('/api/store/order/'+ref)}catch(e){}if(o&&o.status!='pending')break;await new Promise(r=>setTimeout(r,2500))}}
 if(!o)return $('#app').innerHTML=shell(`<div class="box"><b>Order not found</b><p><a class="pill" href="/store">Back to the shop</a></p></div>`);
 if(o.status=='paid'){cart={};keep();badge()}
 const box=(ic,h,body)=>shell(`<div class="box"><div class="bigic">${ic}</div><h2 style="text-align:center;margin:6px 0 10px">${h}</h2>${body}<a class="pill big" style="margin-top:16px" href="/store">Back to the shop</a></div>`);
 const items=o.items.map(i=>`<div class="row"><span>${i.qty} × ${esc(i.name)}</span><b>${money(i.price*i.qty)}</b></div>`).join('')+`<div class="tot"><span>Paid</span><span>${money(o.total)}</span></div>`;
 if(o.status=='paid')return $('#app').innerHTML=box('✅','Thank you, '+esc(o.name.split(' ')[0])+'!',`<p class="mut" style="text-align:center;margin-top:0">Payment received · Receipt <b style="color:var(--ink)">#${esc(o.saleId)}</b> · Order ${esc(ref)}</p>${items}<p>${o.mode=='delivery'?'🚚 We’ll call you to arrange the delivery.':'📦 Your order is ready to pick up at the shop. Show your order number.'}</p>`);
 if(o.status=='paid_short')return $('#app').innerHTML=box('⚠️','Payment received',`<p>Sorry, an item sold out while you were paying. The shop has been told and will call you to refund or swap it.</p><p class="mut">Order ${esc(ref)}</p>`);
 $('#app').innerHTML=box('⏳','Payment not finished',`<p>We haven’t received the payment for order ${esc(ref)} yet. If money left your account, it will show up in a few minutes. Refresh this page.</p><button class="btn big" onclick="location.reload()">Refresh</button>`)}

function render(){$('#app').innerHTML=step=='checkout'?checkoutView():shopView();badge()}
(async()=>{const m=location.pathname.match(/^\/store\/(pay|done)\/(RS[A-Z0-9]{10})/);
 try{await load()}catch(e){return}badge();
 if(m){$('#cartbtn').hidden=m[1]=='pay';$('#catbtn').hidden=true;return m[1]=='pay'&&S.mode=='test'?payView(m[2]):doneView(m[2])}
 render();if(location.hash){const e=document.querySelector(location.hash);if(e)setTimeout(()=>e.scrollIntoView(),50)}})();
</script>
</body>
</html>
