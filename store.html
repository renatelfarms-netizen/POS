<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop online</title>
<meta name="theme-color" content="#0f6e56">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2421;--mut:#68716d;--line:#e4e2db;--ac:#0f6e56;--ac2:#e3f1ec;--bad:#b42318;--warn:#a15c07;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1b201e;--ink:#e9eeeb;--mut:#9aa5a0;--line:#2b322f;--ac:#3fb68e;--ac2:#163229;--bad:#f2867c;--warn:#e7a54b}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top b{font-size:18px;letter-spacing:.2px}.top small{opacity:.85;display:block;font-size:12px}
.top .sp{flex:1}
.cartbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.cartbtn .n{background:#fff;color:var(--ac);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
.test{background:#fff4d6;color:#7a4b00;padding:8px 16px;font-size:14px;border-bottom:1px solid #f0d58c}
@media (prefers-color-scheme:dark){.test{background:#3a2c0b;color:#f3d38a;border-color:#5a4612}}
main{max-width:1040px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input{flex:1;min-width:180px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-weight:600;line-height:1.25}
.pc{font-size:12px;color:var(--mut)}
.pr{font-weight:700;font-size:17px;margin-top:auto}
.left{font-size:12px;color:var(--warn)}.out{font-size:12px;color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{width:100%;padding:14px;font-size:17px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:700;padding-top:10px}
.lbl{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;background:var(--card)}
.seg input{width:auto;margin-top:4px}
.seg label:has(input:checked){border-color:var(--ac);background:var(--ac2)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
.drawer.on{display:block}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.msg{min-height:20px;font-size:14px}
.center{max-width:480px;margin:24px auto}
.big-ic{font-size:52px;text-align:center}
.pay{border:2px dashed #e0b84a;border-radius:var(--r);padding:16px;background:#fffaf0}
@media (prefers-color-scheme:dark){.pay{background:#231d0d;border-color:#7a6220}}
.spin{width:28px;height:28px;border:3px solid var(--ac2);border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(1turn)}}
footer{max-width:1040px;margin:10px auto 40px;padding:0 16px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div class="top"><div><b id="shopname">Shop online</b><small id="shopsub">Order online · pay with MoMo or card</small></div><span class="sp"></span><button class="cartbtn" id="cartbtn" onclick="openCart()" aria-label="Open cart">🛒 Cart <span class="n" id="cartn">0</span></button></div>
<div class="test" id="testbar" hidden>🧪 <b>Test mode:</b> payments are simulated and no money is taken, but orders are recorded in the shop and stock really goes down.</div>
<main id="app"><div class="spin"></div></main>
<footer id="foot"></footer>
<div class="drawer" id="drawer" onclick="if(event.target==this)closeCart()"><div class="pane" id="pane"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={products:[],cur:'GH₵',mode:'test'},cart={},cat='',q='',step='shop',ck={name:'',phone:'',email:'',mode:'pickup',addr:'',city:'',note:''};
try{cart=JSON.parse(sessionStorage.getItem('rs-cart')||'{}')||{}}catch(e){cart={}}
const keep=()=>{try{sessionStorage.setItem('rs-cart',JSON.stringify(cart))}catch(e){}};
const money=n=>S.cur+' '+Number(n||0).toFixed(2);
const P=id=>S.products.find(p=>p.id==id);
const COLORS=['#0f6e56','#2563a8','#8a4fb4','#b45a2a','#a8326e','#3c7a2b','#5b5f97','#9a6b00'];
const tint=s=>COLORS[[...String(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const lines=()=>Object.entries(cart).map(([id,n])=>({p:P(id),n})).filter(x=>x.p&&x.n>0);
const total=()=>lines().reduce((t,x)=>t+x.p.price*x.n,0);
async function call(u,o){const r=await fetch(u,Object.assign({headers:{'Content-Type':'application/json'}},o||{}));let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Something went wrong. Try again.');return j}

async function load(){try{const j=await call('/api/store/info');S=j;document.title=j.name+' · Shop online';$('#shopname').textContent=j.name;
  $('#testbar').hidden=j.mode!='test';
  $('#foot').innerHTML=esc([j.name,j.addr,j.city,j.phone].filter(Boolean).join(' · '))+(j.mode=='paystack-test'?' · Paystack test mode':'');
  Object.keys(cart).forEach(id=>{const p=P(id);if(!p)delete cart[id];else cart[id]=Math.min(cart[id],p.left)});keep()}
 catch(e){$('#app').innerHTML=`<div class="card center"><b>The shop can’t be reached</b><p class="mut">${esc(e.message)}</p><button class="btn pri" onclick="location.reload()">Try again</button></div>`;throw e}}

function shopView(){const cats=[...new Set(S.products.map(p=>p.cat).filter(Boolean))].sort();
 const L=S.products.filter(p=>(!cat||p.cat==cat)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
 return `<div class="bar"><input id="q" placeholder="🔍 Search products" value="${esc(q)}" oninput="q=this.value;$('#grid').innerHTML=cards()"></div>
 ${cats.length>1?`<div class="chips"><button class="chip ${cat?'':'on'}" onclick="cat='';render()">All</button>${cats.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat=${esc(JSON.stringify(c))};render()">${esc(c)}</button>`).join('')}</div>`:''}
 <div class="grid" id="grid">${cards(L)}</div>`}
function cards(L){L=L||S.products.filter(p=>(!cat||p.cat==cat)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
 if(!S.products.length)return `<div class="card" style="grid-column:1/-1"><b>Nothing for sale online yet.</b><p class="mut">Check back soon.</p></div>`;
 if(!L.length)return `<p class="mut" style="grid-column:1/-1">No products match.</p>`;
 return L.map(p=>{const n=cart[p.id]||0,out=p.left<=0;
  return `<div class="p"><div class="ph" style="background:${tint(p.cat||p.name)}">${esc(p.name.trim()[0]||'?').toUpperCase()}</div><div class="pb"><span class="pn">${esc(p.name)}</span><span class="pc">${esc(p.cat||'')}${p.unit&&p.unit!='pcs'?' · per '+esc(p.unit):''}</span>
  ${out?'<span class="out">Sold out</span>':p.left<=5?`<span class="left">Only ${p.left} left</span>`:''}
  <span class="pr">${money(p.price)}</span>
  ${out?'':n?`<div class="qty"><button onclick="add(${p.id},-1)" aria-label="One less">−</button><span>${n}</span><button onclick="add(${p.id},1)" aria-label="One more" ${n>=p.left?'disabled':''}>+</button></div>`:`<button class="btn pri" onclick="add(${p.id},1)">Add to cart</button>`}</div></div>`}).join('')}
function add(id,d){const p=P(id);if(!p)return;const n=Math.max(0,Math.min(p.left,(cart[id]||0)+d));if(n)cart[id]=n;else delete cart[id];keep();badge();if(step=='shop'){const g=$('#grid');if(g)g.innerHTML=cards()}if($('#drawer').classList.contains('on'))cartPane();if(step=='checkout')render()}
function badge(){$('#cartn').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function openCart(){cartPane();$('#drawer').classList.add('on')}
function closeCart(){$('#drawer').classList.remove('on')}
function cartPane(){const L=lines();$('#pane').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:19px">🛒 Your cart</b><button class="btn" onclick="closeCart()">Close</button></div>
 ${L.length?`<div class="card">${L.map(x=>`<div class="row"><div><b>${esc(x.p.name)}</b><br><small class="mut">${money(x.p.price)} each</small></div><div style="text-align:right"><div class="qty"><button onclick="add(${x.p.id},-1)">−</button><span>${x.n}</span><button onclick="add(${x.p.id},1)" ${x.n>=x.p.left?'disabled':''}>+</button></div><small>${money(x.p.price*x.n)}</small></div></div>`).join('')}
 <div class="tot"><span>Total</span><span>${money(total())}</span></div></div><button class="btn pri big" onclick="closeCart();step='checkout';render();scrollTo(0,0)">Checkout</button>`:'<p class="mut">Your cart is empty.</p>'}`}

function checkoutView(){const L=lines();if(!L.length){step='shop';return shopView()}
 const V=(k,t,ph,ac)=>`<input id="f_${k}" type="${t||'text'}" value="${esc(ck[k])}" placeholder="${ph||''}" autocomplete="${ac||'off'}" oninput="ck.${k}=this.value">`;
 return `<button class="btn" onclick="step='shop';render()" style="margin-bottom:12px">← Keep shopping</button>
 <div class="two"><div class="card"><b style="font-size:19px">Your details</b>
  <label class="lbl">Full name *</label>${V('name','text','e.g. Ama Mensah','name')}
  <label class="lbl">Phone number (MoMo) *</label>${V('phone','tel','024 000 0000','tel')}
  <label class="lbl">Email (for your receipt, optional)</label>${V('email','email','you@example.com','email')}
  <label class="lbl">How do you want it?</label>
  <div class="seg"><label><input type="radio" name="dm" value="pickup" ${ck.mode=='pickup'?'checked':''} onchange="ck.mode='pickup';render()"><span><b>Pick up</b><br><small class="mut">Collect at the shop${S.city?' in '+esc(S.city):''}</small></span></label>
  <label><input type="radio" name="dm" value="delivery" ${ck.mode=='delivery'?'checked':''} onchange="ck.mode='delivery';render()"><span><b>Delivery</b><br><small class="mut">We call you to arrange it</small></span></label></div>
  ${ck.mode=='delivery'?`<label class="lbl">Delivery address or landmark *</label>${V('addr','text','House no., street, landmark','street-address')}<label class="lbl">Town / city</label>${V('city','text','e.g. Kumasi')}<p class="mut" style="font-size:14px;margin:6px 0 0">Any delivery fee is agreed with you on the phone.</p>`:''}
  <label class="lbl">Note (optional)</label><textarea id="f_note" rows="2" oninput="ck.note=this.value">${esc(ck.note)}</textarea>
 </div>
 <div class="card"><b style="font-size:19px">Order summary</b>${L.map(x=>`<div class="row"><span>${x.n} × ${esc(x.p.name)}</span><b>${money(x.p.price*x.n)}</b></div>`).join('')}
  <div class="tot"><span>Total</span><span>${money(total())}</span></div>
  <p id="cmsg" class="msg bad" role="status" aria-live="polite"></p>
  <button class="btn pri big" id="paybtn" onclick="placeOrder()">Pay ${money(total())}</button>
  <p class="mut" style="font-size:13px;margin:10px 0 0">${S.mode=='test'?'Test mode: you’ll see a practice payment screen. No money is taken.':'You’ll be taken to Paystack to pay securely with Mobile Money or card.'}</p></div></div>`}
async function placeOrder(){const b=$('#paybtn'),m=$('#cmsg');m.textContent='';
 ['name','phone','email','addr','city','note'].forEach(k=>{const e=$('#f_'+k);if(e)ck[k]=e.value});
 if(!ck.name.trim())return m.textContent='Enter your name.';if(ck.phone.replace(/\D/g,'').length<10)return m.textContent='Enter a valid phone number.';
 if(ck.mode=='delivery'&&!ck.addr.trim())return m.textContent='Enter the delivery address.';
 b.disabled=true;b.textContent='Please wait…';
 try{const j=await call('/api/store/order',{method:'POST',body:JSON.stringify(Object.assign({},ck,{items:lines().map(x=>({id:x.p.id,qty:x.n}))}))});location.href=j.pay_url}
 catch(e){m.textContent=e.message;b.disabled=false;b.textContent='Pay '+money(total());load().then(()=>{badge()}).catch(()=>{})}}

async function payView(ref){$('#app').innerHTML='<div class="spin"></div>';let o;try{o=await call('/api/store/order/'+ref)}catch(e){return $('#app').innerHTML=`<div class="card center"><b>Order not found</b><p class="mut">${esc(e.message)}</p><a class="btn" href="/store">Back to the shop</a></div>`}
 if(o.status!='pending')return doneView(ref,o);
 $('#app').innerHTML=`<div class="center"><div class="pay"><b style="font-size:19px">🧪 Test payment</b><p class="mut" style="margin:4px 0 12px">This screen stands in for Paystack while the shop is in test mode. No money is taken.</p>
  ${o.items.map(i=>`<div class="row"><span>${i.qty} × ${esc(i.name)}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}<div class="tot"><span>Amount</span><span>${money(o.total)}</span></div>
  <p class="mut" style="font-size:14px">Order ${esc(ref)} · ${esc(o.name)}</p>
  <p id="pmsg" class="msg bad"></p>
  <button class="btn pri big" id="okb" onclick="testPay('${ref}',true)">✔ Simulate successful MoMo payment</button>
  <button class="btn big" style="margin-top:8px" onclick="testPay('${ref}',false)">✖ Simulate failed payment</button></div></div>`}
async function testPay(ref,ok){const b=$('#okb');b.disabled=true;b.textContent='Processing…';
 try{const o=await call('/api/store/testpay',{method:'POST',body:JSON.stringify({ref,ok})});if(!ok){$('#pmsg').textContent='Payment failed (test). Nothing was charged and no stock was taken. You can try again.';b.disabled=false;b.textContent='✔ Simulate successful MoMo payment';return}doneView(ref,o)}
 catch(e){$('#pmsg').textContent=e.message;b.disabled=false;b.textContent='✔ Simulate successful MoMo payment'}}

async function doneView(ref,o){if(!o){$('#app').innerHTML='<div class="spin"></div><p class="mut" style="text-align:center">Checking your payment…</p>';
  for(let i=0;i<6;i++){try{o=await call('/api/store/order/'+ref)}catch(e){}if(o&&o.status!='pending')break;await new Promise(r=>setTimeout(r,2500))}}
 if(!o)return $('#app').innerHTML=`<div class="card center"><b>Order not found</b><a class="btn" href="/store">Back to the shop</a></div>`;
 if(o.status=='paid'){cart={};keep();badge()}
 const box=(ic,h,body)=>`<div class="card center"><div class="big-ic">${ic}</div><h2 style="text-align:center;margin:6px 0">${h}</h2>${body}<a class="btn pri big" style="display:block;text-align:center;text-decoration:none;margin-top:14px" href="/store">Back to the shop</a></div>`;
 const items=o.items.map(i=>`<div class="row"><span>${i.qty} × ${esc(i.name)}</span><b>${money(i.price*i.qty)}</b></div>`).join('')+`<div class="tot"><span>Paid</span><span>${money(o.total)}</span></div>`;
 if(o.status=='paid')return $('#app').innerHTML=box('✅','Thank you, '+esc(o.name.split(' ')[0])+'!',`<p class="mut" style="text-align:center">Payment received. Receipt <b>#${esc(o.saleId)}</b> · order ${esc(ref)}</p>${items}<p>${o.mode=='delivery'?'We’ll call you to arrange the delivery.':'Your order is ready to pick up at the shop. Show your order number.'}</p>`);
 if(o.status=='paid_short')return $('#app').innerHTML=box('⚠️','Payment received',`<p>Sorry, an item sold out while you were paying. The shop has been told and will call you to refund or swap it.</p><p class="mut">Order ${esc(ref)}</p>`);
 $('#app').innerHTML=box('⏳','Payment not finished',`<p>We haven’t received the payment for order ${esc(ref)} yet. If money left your account, it will show up in a few minutes. Refresh this page.</p><button class="btn big" onclick="location.reload()">Refresh</button>`)}

function render(){const v=step=='checkout'?checkoutView():shopView();$('#app').innerHTML=v;badge()}
(async()=>{const m=location.pathname.match(/^\/store\/(pay|done)\/(RS[A-Z0-9]{10})/);
 try{await load()}catch(e){return}badge();
 if(m){$('#cartbtn').hidden=m[1]=='pay';return m[1]=='pay'&&S.mode=='test'?payView(m[2]):doneView(m[2])}
 render()})();
</script>
</body>
</html>
