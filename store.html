<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop online</title>
<meta name="theme-color" content="#0b7a4b">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b7a4b;--g2:#08643d;--gl:#e7f4ee;--y:#ffc61a;--yd:#f5b800;--ink:#1b1f1d;--mut:#6e7571;--line:#ebedeb;--soft:#f4f5f3;--card:#fff;--bad:#c62828;--r:16px;--sh:0 2px 10px rgba(16,24,20,.05)}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}html{scroll-behavior:smooth}
body{background:#fff;color:var(--ink);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.g{color:var(--g)}

/* top bar */
.nav{background:var(--g);color:#fff;position:sticky;top:0;z-index:20}
.nav .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:9px;background:#fff;display:grid;place-items:center;font-style:normal;font-size:17px}
.catbtn{background:var(--y);color:var(--ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.links{display:flex;gap:22px;font-size:14px;margin-left:8px}.links a{text-decoration:none;opacity:.92}.links a:hover{opacity:1;text-decoration:underline}
.sp{flex:1}
.cartbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.cartbtn .n{background:var(--y);color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
@media (max-width:820px){.links{display:none}}
.cartbtn,.catbtn,.logo{white-space:nowrap;flex:none}
@media (max-width:900px){.catbtn span{display:none}}
@media (max-width:640px){#acctname{display:none}.nav .wrap{gap:8px}.cartbtn{padding:7px 10px}}
body{overflow-x:hidden}
@media (max-width:520px){.logo b{max-width:42vw;overflow:hidden;text-overflow:ellipsis}}
.locbar{background:var(--gl);font-size:13px;padding:7px 0;border-bottom:1px solid #d6ebe0}
.locbar .wrap{display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.locbar .wrap>span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.locbar .lreg{display:none}}
.locbar button{background:none;border:0;color:var(--g);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:40;display:grid;place-items:center;padding:16px}
.modal .mbox{background:#fff;border-radius:20px;padding:24px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin-top:6px}
.pimg img{width:100%;height:100%;object-fit:cover;border-radius:12px;position:absolute;inset:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;margin:6px 0 16px}
.tabs button{border:0;background:none;border-radius:999px;padding:10px;font-weight:600;cursor:pointer;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--g);box-shadow:var(--sh)}
.acct{background:#fff;color:var(--g);border:0}
.ostat{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--gl);color:var(--g)}
.ostat.p{background:#fff4d4;color:#7a5600}.ostat.x{background:#fdeceb;color:var(--bad)}
.test{background:#fff6d6;color:#6b4a00;font-size:13px;padding:8px 0;border-bottom:1px solid #f3df9a}

/* shared buttons */
.pill{background:var(--g);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.pill:hover{background:var(--g2)}
.pill.sm{padding:9px 18px;font-size:13px}
.ulink{font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;background:none;border:0;padding:0}
/* ---------- live aquarium hero ---------- */
.reef{position:relative;overflow:hidden;color:#fff;min-height:440px;display:flex;align-items:center;
 background:radial-gradient(120% 90% at 70% -10%,#3fd0c9 0,#0e8c8a 32%,#06505f 70%,#03303d 100%)}
@media (max-width:640px){.reef{min-height:400px}}
.reef .rays{position:absolute;inset:-40% -10% 0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.10) 0 40px,rgba(255,255,255,0) 40px 120px);
 transform-origin:50% 0;animation:sway 9s ease-in-out infinite alternate;mix-blend-mode:screen;opacity:.55;filter:blur(6px)}
@keyframes sway{from{transform:rotate(-4deg) translateX(-3%)}to{transform:rotate(4deg) translateX(3%)}}
.reef .caust{position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.12) 0 6%,transparent 7%),radial-gradient(circle at 70% 20%,rgba(255,255,255,.10) 0 5%,transparent 6%),radial-gradient(circle at 45% 60%,rgba(255,255,255,.08) 0 7%,transparent 8%);
 background-size:260px 260px;animation:caust 14s linear infinite;opacity:.6}
@keyframes caust{to{background-position:260px 130px,-260px 260px,130px -260px}}
.reef .sand{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,#e9d6a3,#cdb47c);border-radius:50% 50% 0 0/24px 24px 0 0}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,255,255,.08) 60%);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(12px,-230px)}100%{transform:translate(-6px,-500px);opacity:0}}
.fishlane{position:absolute;left:0;right:0;height:60px}
.fish{position:absolute;left:-140px;width:96px;animation:swim linear infinite}
.fish.rev{animation-name:swimrev;left:auto;right:-140px}
.fish.rev svg{transform:scaleX(-1)}
.fish svg{display:block;width:100%;height:auto;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
@keyframes swim{to{transform:translateX(calc(100vw + 280px))}}
@keyframes swimrev{to{transform:translateX(calc(-100vw - 280px))}}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.fish.rev svg{animation-name:bobrev}@keyframes bobrev{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-10px) rotate(-3deg)}}
.tailw{transform-origin:22px 30px;animation:tail .45s ease-in-out infinite alternate}@keyframes tail{to{transform:scaleY(.6)}}
.weed{position:absolute;bottom:40px;transform-origin:50% 100%;animation:weed 4.5s ease-in-out infinite alternate}
@keyframes weed{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.reef>.wrap{width:100%;position:relative;z-index:3}
.fishlane{z-index:1}.bub{z-index:1}
.reef .copy{position:relative;z-index:3;padding:56px 0 92px;max-width:620px}
.reef .open{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.reef .open i{width:8px;height:8px;border-radius:50%;background:#5ef08f;box-shadow:0 0 0 0 rgba(94,240,143,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(94,240,143,0)}100%{box-shadow:0 0 0 0 rgba(94,240,143,0)}}
.reef h1{font-size:clamp(34px,5.6vw,58px);line-height:1.06;margin:16px 0 12px;font-weight:700;letter-spacing:-.8px;text-shadow:0 2px 2px rgba(0,0,0,.25),0 6px 28px rgba(0,30,40,.45)}
.reef .lead{text-shadow:0 1px 10px rgba(0,30,40,.6)}
@media (max-width:640px){.fish{opacity:.75}.reef .copy{padding:40px 0 86px}}
.reef h1 span{color:var(--y)}
.reef .lead{color:rgba(255,255,255,.88);font-size:16px;margin:0 0 24px;max-width:480px}
.reef .pill{background:var(--y);color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.2)}.reef .pill:hover{background:#ffd54d}
.fadeup{opacity:0;transform:translateY(18px);animation:fu .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fu{to{opacity:1;transform:none}}
/* ticker */
.ticker{background:var(--g);color:#fff;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:500;padding:11px 0}
.ticker .run{display:inline-block;animation:tick 40s linear infinite}
.ticker .run span{margin:0 22px;opacity:.95}
@keyframes tick{to{transform:translateX(-50%)}}
/* product toolbar */
section{padding:44px 0;scroll-margin-top:62px}
.eyebrow{font-size:13px;color:var(--mut);margin:0}
h2{font-size:clamp(24px,3vw,32px);margin:2px 0 0;font-weight:700;letter-spacing:-.3px}
.center{text-align:center}
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--g);transform:translateY(-1px)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip small{opacity:.7;font-weight:500}
/* reveal on scroll */
.rv{opacity:0;transform:translateY(22px) scale(.98);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.trustrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:720px){.trustrow{grid-template-columns:1fr}}
.tr{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:var(--r);padding:16px}
.tr i{width:44px;height:44px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px;flex:none}
.tr b{display:block}.tr span{color:var(--mut);font-size:13px}
@media (prefers-reduced-motion:reduce){.reef *,.ticker .run,.rv,.fadeup{animation:none!important;transition:none!important}.rv,.fadeup{opacity:1;transform:none}.fish,.bub{display:none}.ticker .run{padding-left:0}}
.prods{background:var(--soft)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 6px 4px 16px;box-shadow:var(--sh);min-width:260px}
.search input{border:0;outline:0;background:none;padding:8px 0;flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.p{background:var(--card);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;box-shadow:var(--sh);transition:.15s}
.p{transition:transform .25s ease,box-shadow .25s ease}
.p:hover{box-shadow:0 16px 34px rgba(16,24,20,.12);transform:translateY(-4px)}
.p .pimg{overflow:hidden}.p .pimg>img,.p .pimg>.ico{transition:transform .5s ease}.p:hover .pimg>img,.p:hover .pimg>.ico{transform:scale(1.07)}
.ico{display:inline-block}
.p.pop{animation:pop .45s ease}@keyframes pop{40%{transform:scale(1.035);box-shadow:0 0 0 3px var(--g)}}
.cartbtn.bump .n{animation:bump .5s ease}@keyframes bump{30%{transform:scale(1.5)}60%{transform:scale(.9)}}
.pimg{position:relative;aspect-ratio:1.15;border-radius:12px;display:grid;place-items:center;font-size:clamp(48px,7vw,66px)}
.badge{position:absolute;top:8px;left:8px;background:var(--g);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px}
.badge.low{background:var(--y);color:var(--ink)}.badge.out{background:#9aa19d}
.pcat{color:var(--g);font-size:12px;margin-top:10px}
.pn{font-weight:600;font-size:15px;line-height:1.3;margin:1px 0}
.pu{color:var(--mut);font-size:12px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.price{font-weight:700;font-size:16px;white-space:nowrap}
.pfoot{flex-wrap:wrap;row-gap:8px}
.add{background:var(--gl);color:var(--g);border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.add:hover{background:var(--g);color:#fff}
.add svg{width:14px;height:14px}
.qty{display:flex;align-items:center;gap:4px;background:var(--gl);border-radius:999px;padding:3px}
.qty button{width:28px;height:28px;border-radius:50%;border:0;background:#fff;color:var(--g);font-size:16px;font-weight:700;cursor:pointer}
.qty button:disabled{opacity:.4}
.qty span{min-width:20px;text-align:center;font-weight:600;font-size:13px}
.empty{background:#fff;border-radius:var(--r);padding:30px;text-align:center;grid-column:1/-1}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
@media (max-width:820px){.how{grid-template-columns:1fr}}
.step{background:var(--soft);border-radius:var(--r);padding:22px}
.step i{width:44px;height:44px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px;margin-bottom:12px}
.step b{display:block;font-size:16px;margin-bottom:4px}.step p{margin:0;color:var(--mut);font-size:14px}
footer{background:#0d2a1e;color:#cfe0d7;padding:36px 0;font-size:14px}
footer b{color:#fff}

/* checkout, payment, receipt */
.page{padding:28px 0 60px;background:var(--soft);min-height:70vh}
.box{background:#fff;border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.lbl{display:block;font-size:13px;color:var(--mut);margin:14px 0 5px;font-weight:500}
input.f,textarea.f{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--gl)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.seg input{margin-top:5px;accent-color:var(--g)}
.seg label:has(input:checked){border-color:var(--g);background:var(--gl)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:700;padding-top:12px}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.big{width:100%;justify-content:center;padding:14px;font-size:16px}
.pill:disabled{opacity:.55;cursor:not-allowed}
.msg{min-height:20px;font-size:14px;color:var(--bad);margin:10px 0 0}
.mut{color:var(--mut)}
.narrow{max-width:500px;margin:0 auto}
.paybox{border:2px dashed #e7c24d;background:#fffbea}
.bigic{font-size:54px;text-align:center}
.spin{width:30px;height:30px;border:3px solid var(--gl);border-top-color:var(--g);border-radius:50%;animation:s 1s linear infinite;margin:60px auto}
@keyframes s{to{transform:rotate(1turn)}}
.drawer{position:fixed;inset:0;background:rgba(10,20,15,.45);display:none;z-index:30}
.drawer.on{display:block}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:#fff;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
 <a class="logo" href="/"><i>🛍️</i><b id="shopname">Shop online</b></a>
 <button class="catbtn" id="catbtn" onclick="goCats()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Browse All Categories</span></button>
 <nav class="links" id="links"><a href="/">Home</a><a href="/#products">Shop</a><a id="calllink" href="#">Contact</a></nav>
 <span class="sp"></span>
 <a class="cartbtn" id="posbtn" href="/pos" hidden style="text-decoration:none;background:var(--y);color:var(--ink);border:0" title="Back to the staff POS">🔐 <span id="posl">POS</span></a>
 <button class="cartbtn" id="acctbtn" onclick="goAccount()" aria-label="My account"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span id="acctname">Sign in</span></button>
 <button class="cartbtn" id="cartbtn" onclick="openCart()" aria-label="Open cart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Cart <span class="n" id="cartn">0</span></button>
</div></header>
<div class="test" id="annbar" hidden style="background:var(--y);color:var(--ink);border:0;font-weight:500"><div class="wrap" id="annwrap"></div></div>
<div class="locbar" id="locbar" hidden><div class="wrap" id="locwrap"></div></div>
<div class="test" id="testbar" hidden><div class="wrap">🧪 <b>Test mode:</b> payments are simulated and no money is taken, but orders are recorded in the shop and stock really goes down.</div></div>
<main id="app"><div class="spin"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="modal" id="locmodal" hidden></div>
<div class="drawer" id="drawer" onclick="if(event.target==this)closeCart()"><div class="pane" id="pane"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={products:[],cur:'GH₵',mode:'test'},cart={},cat='',q='',step='shop',ck={name:'',phone:'',email:'',mode:'pickup',addr:'',city:'',note:''};
try{cart=JSON.parse(sessionStorage.getItem('rs-cart')||'{}')||{}}catch(e){cart={}}
const keep=()=>{try{sessionStorage.setItem('rs-cart',JSON.stringify(cart))}catch(e){}};
const money=n=>S.cur+' '+Number(n||0).toFixed(2);
const P=id=>S.products.find(p=>p.id==id);
const BAG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>';
// An icon and soft colour for each category, picked from words in its name.
const ICONS=[[/fish|aqua|tank|pet|coral/i,'🐠'],[/medic|drug|pharm|treat|health/i,'💊'],[/feed|food|snack|provision|grain|rice/i,'🥫'],[/drink|water|juice|bever/i,'🥤'],[/fruit/i,'🍎'],[/veg|plant|seed|grow|garden|farm/i,'🌱'],[/egg|poultry|chick/i,'🥚'],[/milk|dairy/i,'🥛'],[/bak|bread/i,'🥖'],[/toilet|soap|clean|house/i,'🧴'],[/station|book|pen/i,'📒'],[/phone|access/i,'📱'],[/electr|light|pump|filter/i,'🔌'],[/cloth|wear|fashion/i,'👕'],[/tool|equip/i,'🧰'],[/test/i,'🧪']];
const icon=c=>{for(const [rx,e] of ICONS)if(rx.test(c||''))return e;return '🛍️'};
const TINTS=['#eaf6ef','#fff4d4','#e8f1fb','#fdeceb','#f1ecfb','#e9f6f6','#fbefe3'];
const tint=s=>TINTS[[...String(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)%TINTS.length];
// Ghana regions (capital town coordinates) and the two branches; customers are served by the nearest branch.
const REGIONS={'Greater Accra':[5.6037,-0.187],'Ashanti':[6.6885,-1.6244],'Eastern':[6.0941,-0.2591],'Central':[5.1053,-1.2466],'Western':[4.934,-1.7137],'Western North':[6.2058,-2.4895],'Volta':[6.6008,0.4713],'Oti':[8.0667,0.1833],'Bono':[7.3349,-2.3123],'Bono East':[7.5833,-1.9333],'Ahafo':[6.8036,-2.5172],'Northern':[9.4008,-0.8393],'Savannah':[9.0833,-1.8167],'North East':[10.5275,-0.3683],'Upper East':[10.7856,-0.8514],'Upper West':[10.0601,-2.5099]};

const km=(a,b)=>{const r=x=>x*Math.PI/180,d=r(b[0]-a[0]),e=r(b[1]-a[1]),h=Math.sin(d/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(e/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const nearest=pt=>Object.keys(BRPOS).sort((x,y)=>km(pt,BRPOS[x])-km(pt,BRPOS[y]))[0];
const nearRegion=pt=>Object.keys(REGIONS).sort((x,y)=>km(pt,REGIONS[x])-km(pt,REGIONS[y]))[0];

 navigator.geolocation.getCurrentPosition(p=>{const pt=[p.coords.latitude,p.coords.longitude],br=nearest(pt);setLoc({region:nearRegion(pt),branch:br,km:Math.round(km(pt,BRPOS[br])),how:'gps'})},

const FISH=(a,b)=>`<svg viewBox="0 0 100 60" aria-hidden="true"><g class="tailw"><path d="M22 30 L2 12 Q8 30 2 48 Z" fill="${b}"/></g><ellipse cx="55" cy="30" rx="36" ry="21" fill="${a}"/><path d="M42 12 Q55 0 68 12" fill="${b}"/><path d="M48 46 Q56 58 64 46" fill="${b}"/><path d="M36 14 Q30 30 36 46" stroke="rgba(255,255,255,.55)" stroke-width="4" fill="none"/><path d="M52 11 Q46 30 52 49" stroke="rgba(255,255,255,.35)" stroke-width="3" fill="none"/><circle cx="76" cy="25" r="5.5" fill="#fff"/><circle cx="77.5" cy="25" r="3" fill="#13222a"/></svg>`;
const WEED=(h,c)=>`<svg width="40" height="${h}" viewBox="0 0 40 ${h}" aria-hidden="true"><path d="M20 ${h} C6 ${h*.7} 34 ${h*.45} 20 ${h*.2} C12 ${h*.08} 22 0 22 0" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M20 ${h} C30 ${h*.75} 8 ${h*.5} 26 ${h*.3}" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/></svg>`;
function reefScene(){const r=(a,b)=>a+Math.random()*(b-a);
 const bubbles=Array.from({length:18},()=>{const z=r(6,18);return `<span class="bub" style="left:${r(2,98)}%;width:${z}px;height:${z}px;animation-duration:${r(7,15)}s;animation-delay:-${r(0,15)}s"></span>`}).join('');
 const fish=[['#ffc61a','#f59e0b',22,26,0,0],['#ff7a59','#e2553a',46,34,-12,1],['#7dd3fc','#38bdf8',64,30,-5,0],['#a3e635','#65a30d',34,42,-22,1],['#f9a8d4','#ec4899',78,38,-28,0]]
  .map(([a,b,top,dur,del,rev],k)=>`<div class="fishlane" style="top:${top}%"><div class="fish ${rev?'rev':''}" style="animation-duration:${dur}s;animation-delay:${del}s;width:${[96,70,84,60,54][k]}px">${FISH(a,b)}</div></div>`).join('');
 const weeds=[[4,120,'#1f9d55',0],[9,80,'#2fb36a',.8],[86,130,'#1f9d55',.4],[92,90,'#36c275',1.3],[78,70,'#2fb36a',2]].map(([l,h,c,d])=>`<div class="weed" style="left:${l}%;animation-delay:-${d}s">${WEED(h,c)}</div>`).join('');
 return `<div class="rays"></div><div class="caust"></div>${fish}${bubbles}${weeds}<div class="sand"></div>`}

let RVO=null;function reveal(){const els=[...document.querySelectorAll('.rv:not(.in)')];if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
 if(!RVO)RVO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');RVO.unobserve(e.target)}}),{rootMargin:'0px 0px -40px 0px'});
 els.forEach((e,k)=>{e.style.transitionDelay=Math.min(k%4,3)*70+'ms';RVO.observe(e)})}

 if(!L.length)return `<div class="empty"><b>No products match.</b><p class="mut"><button class="ulink" onclick="q='';cat='';render()">Show all products</button></p></div>`;
 return L.map(p=>{const n=cart[p.id]||0,out=p.left<=0,low=!out&&p.left<=5;

 ['email','addr','city','note'].forEach(k=>{const e=$('#f_'+k);if(e)ck[k]=e.value});

async function testPay(ref,ok){const b=$('#okb');b.disabled=true;b.textContent='Processing…';
 try{const o=await call('/api/store/testpay',{method:'POST',body:JSON.stringify({ref,ok})});if(!ok){$('#pmsg').textContent='Payment failed (test). Nothing was charged and no stock was taken. You can try again.';b.disabled=false;b.textContent='✔ Simulate successful MoMo payment';return}doneView(ref,o)}
 catch(e){$('#pmsg').textContent=e.message;b.disabled=false;b.textContent='✔ Simulate successful MoMo payment'}}

async function doneView(ref,o){$('#cartbtn').hidden=false;if(!o){$('#app').innerHTML='<div class="spin"></div><p class="mut" style="text-align:center">Checking your payment…</p>';
  for(let i=0;i<6;i++){try{o=await call('/api/store/order/'+ref)}catch(e){}if(o&&!['pending','processing'].includes(o.status))break;await new Promise(r=>setTimeout(r,2500))}}
 if(!o)return $('#app').innerHTML=shell(`<div class="box"><b>Order not found</b><p><a class="pill" href="/">Back to the shop</a></p></div>`);
 if(o.status=='paid'){cart={};keep();badge()}
 const box=(ic,h,body)=>shell(`<div class="box"><div class="bigic">${ic}</div><h2 style="text-align:center;margin:6px 0 10px">${h}</h2>${body}<a class="pill big" style="margin-top:16px" href="/">Back to the shop</a></div>`);
 const items=o.items.map(i=>`<div class="row"><span>${i.qty} × ${esc(i.name)}</span><b>${money(i.price*i.qty)}</b></div>`).join('')+`<div class="tot"><span>Paid</span><span>${money(o.total)}</span></div>`;
 if(o.status=='paid')return $('#app').innerHTML=box('✅','Thank you, '+esc(o.name.split(' ')[0])+'!',`<p class="mut" style="text-align:center;margin-top:0">Payment received · Receipt <b style="color:var(--ink)">#${esc(o.saleId)}</b> · Order ${esc(ref)}</p>${items}<p>${o.mode=='delivery'?'🚚 We’ll call you to arrange the delivery.':'📦 Your order is ready to pick up at our '+esc(o.branchName||'shop')+'. Show your order number.'}</p>`);
 if(o.status=='paid_short')return $('#app').innerHTML=box('⚠️','Payment received',`<p>Sorry, an item sold out while you were paying. The shop has been told and will call you to refund or swap it.</p><p class="mut">Order ${esc(ref)}</p>`);
 $('#app').innerHTML=box('⏳','Payment not finished',`<p>We haven’t received the payment for order ${esc(ref)} yet. If money left your account, it will show up in a few minutes. Refresh this page.</p><button class="btn big" onclick="location.reload()">Refresh</button>`)}

// ---- customer accounts ----
let nextStep='shop',authMode='signup',au={name:'',phone:'',email:'',password:'',password2:'',code:'',sent:''};
function goCheckout(){closeCart();if(!lines().length)return;step=ME?'checkout':'auth';nextStep='checkout';if(!ME)authMode='signup';render();scrollTo(0,0)}
function goAccount(){closeCart();step=ME?'account':'auth';nextStep='account';if(!ME)authMode='signin';if(/^\/store\/(pay|done)\//.test(location.pathname)){location.href='/#account';return}render();scrollTo(0,0)}
function authView(){const A=(k,t,ph,ac,lbl)=>`<label class="lbl">${lbl}</label><input class="f" id="a_${k}" type="${t}" value="${esc(au[k])}" placeholder="${ph}" autocomplete="${ac}" oninput="au.${k}=this.value" onkeydown="if(event.key=='Enter')authGo()">`;
 const why=nextStep=='checkout'?`<div style="background:var(--gl);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:8px">🛒 Your cart is saved (${lines().reduce((t,x)=>t+x.n,0)} item${lines().reduce((t,x)=>t+x.n,0)==1?'':'s'}, ${money(total())}). ${authMode=='signin'?'Sign in':'Create a free account'} to check out.</div>`:'';
 let body;
 if(authMode=='reset')body=`<h2 style="font-size:22px;margin:0 0 4px">Reset your password</h2><p class="mut" style="margin:0;font-size:14px">We email a 6-digit code to the address on your account.</p>
  ${A('phone','tel','024 000 0000','tel','Phone number of your account')}
  ${au.sent?`<p class="mut" style="font-size:13px;margin:8px 0 0">Code sent to <b>${esc(au.sent)}</b>. Check spam too.</p>${A('code','text','123456','one-time-code','Code from the email')}${A('password','password','At least 6 characters','new-password','New password')}`:''}
  <p id="amsg" class="msg" role="status" aria-live="polite"></p><button class="pill big" id="ago" onclick="authGo()">${au.sent?'Set new password':'Send code'}</button>
  <p style="text-align:center;margin:14px 0 0"><button class="ulink" onclick="authMode='signin';au.sent='';render()">Back to sign in</button></p>`;
 else body=`<div class="tabs"><button class="${authMode=='signup'?'on':''}" onclick="authMode='signup';render()">Create account</button><button class="${authMode=='signin'?'on':''}" onclick="authMode='signin';render()">Sign in</button></div>
  ${authMode=='signup'?`${A('name','text','e.g. Ama Mensah','name','Full name *')}${A('phone','tel','024 000 0000','tel','Phone number (MoMo) *')}${A('email','email','you@example.com','email','Email (for receipts and password reset)')}${A('password','password','At least 6 characters','new-password','Choose a password *')}${A('password2','password','Type it again','new-password','Confirm password *')}`
   :`${A('phone','tel','024 000 0000','tel','Phone number')}${A('password','password','Your password','current-password','Password')}<p style="text-align:right;margin:8px 0 0"><button class="ulink" style="font-size:13px" onclick="authMode='reset';au.sent='';render()">Forgot password?</button></p>`}
  <p id="amsg" class="msg" role="status" aria-live="polite"></p><button class="pill big" id="ago" onclick="authGo()">${authMode=='signup'?'Create account':'Sign in'}${nextStep=='checkout'?' & continue →':''}</button>
  ${authMode=='signup'?'<p class="mut" style="font-size:12px;text-align:center;margin:10px 0 0">Your account lets you track orders and check out faster next time.</p>':''}`;
 return `<div class="page"><div class="wrap narrow">${nextStep=='checkout'?`<button class="btn" onclick="step='shop';render()" style="margin-bottom:16px">← Keep shopping</button>`:''}${why}<div class="box">${body}</div></div></div>`}
async function authGo(){const m=$('#amsg'),b=$('#ago');m.textContent='';['name','phone','email','password','password2','code'].forEach(k=>{const e=$('#a_'+k);if(e)au[k]=e.value});
 const label=b.textContent;b.disabled=true;b.textContent='Please wait…';
 try{let j;
  if(authMode=='signup'){if(au.password!==au.password2)throw new Error('The two passwords don’t match.');j=await call('/api/store/signup',{method:'POST',body:JSON.stringify({name:au.name,phone:au.phone,email:au.email,password:au.password,region:(LOC&&LOC.region)||'',branch:BRANCH()})})}
  else if(authMode=='signin')j=await call('/api/store/login',{method:'POST',body:JSON.stringify({phone:au.phone,password:au.password})});
  else if(!au.sent){const r=await call('/api/store/reset/code',{method:'POST',body:JSON.stringify({phone:au.phone})});au.sent=r.to;b.disabled=false;return render()}
  else j=await call('/api/store/reset',{method:'POST',body:JSON.stringify({phone:au.phone,code:au.code,password:au.password})});
  saveMe(j.token,j.me);au={name:'',phone:'',email:'',password:'',password2:'',code:'',sent:''};step=nextStep;render();scrollTo(0,0)}
 catch(e){m.textContent=e.message;if(e.j&&e.j.exists){authMode='signin';render();$('#amsg').textContent=e.message}else{b.disabled=false;b.textContent=label}}}
let acc={orders:null,err:''};
function accountView(){if(!ME){step='auth';return authView()}if(acc.orders==null&&!acc.busy){acc.busy=true;call('/api/store/me').then(j=>{acc.orders=j.orders;saveMe(null,j.me)}).catch(e=>{acc.err=e.message;acc.orders=[]}).finally(()=>{acc.busy=false;if(step=='account')render()})}
 const me=ME.me,st=o=>o.status=='paid'?(o.fulfil=='done'?`<span class="ostat">✔ ${o.mode=='delivery'?'Delivered':'Collected'}</span>`:o.fulfil=='ready'?`<span class="ostat">${o.mode=='delivery'?'On its way soon':'Ready for pickup'}</span>`:'<span class="ostat">Paid · being prepared</span>'):o.fulfil=='refunded'?'<span class="ostat x">Refunded</span>':o.fulfil=='cancelled'?'<span class="ostat x">Cancelled</span>':o.status=='paid_short'?'<span class="ostat x">Paid · item sold out</span>':'<span class="ostat p">Not paid</span>';
 return `<div class="page"><div class="wrap"><div class="phead" style="margin-bottom:16px"><div><p class="eyebrow">Hello, ${esc(me.name.split(' ')[0])}</p><h2>My <span class="g">Account</span></h2></div><button class="btn" onclick="signOut();step='shop';render()">Sign out</button></div>
 <div class="two"><div class="box"><b style="font-size:18px">My orders</b>${acc.orders==null?'<div class="spin" style="margin:30px auto"></div>':acc.orders.length?acc.orders.map(o=>`<div class="row" style="align-items:flex-start"><div><b>${o.saleId?'Receipt #'+esc(o.saleId):'Order '+esc(o.ref)}</b> ${st(o)}<br><small class="mut">${new Date(o.created).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})} · ${esc(o.branchName||'')} · ${o.mode=='delivery'?'Delivery':'Pickup'}</small><br><small>${o.items.map(i=>i.qty+' × '+esc(i.name)).join(', ')}</small></div><b>${money(o.total)}</b></div>`).join(''):`<p class="mut">No orders yet. <a href="#products" onclick="step='shop';render()">Start shopping</a></p>`}${acc.err?`<p class="msg">${esc(acc.err)}</p>`:''}</div>
 <div class="box"><b style="font-size:18px">My details</b>
  <label class="lbl">Full name</label><input class="f" id="m_name" value="${esc(me.name)}">
  <label class="lbl">Phone number</label><input class="f" value="${esc(me.phone)}" disabled>
  <label class="lbl">Email</label><input class="f" id="m_email" type="email" value="${esc(me.email)}" placeholder="you@example.com">
  <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;font-size:14px">Change password</summary><label class="lbl">Current password</label><input class="f" id="m_old" type="password" autocomplete="current-password"><label class="lbl">New password</label><input class="f" id="m_new" type="password" autocomplete="new-password" placeholder="At least 6 characters"></details>
  <p id="mmsg" class="msg" role="status"></p><button class="pill big" onclick="saveAcct(this)">Save changes</button></div></div></div></div>`}
async function saveAcct(b){const m=$('#mmsg'),body={name:$('#m_name').value,email:$('#m_email').value};if($('#m_new').value){body.password=$('#m_new').value;body.oldPassword=$('#m_old').value}
 b.disabled=true;try{const j=await call('/api/store/me',{method:'POST',body:JSON.stringify(body)});saveMe(j.token||null,j.me);m.style.color='var(--g)';m.textContent='✔ Saved.';acctUI()}catch(e){m.style.color='';m.textContent=e.message}b.disabled=false}
function render(){if(step!='account')acc={orders:null,err:''};$('#app').innerHTML=step=='checkout'?checkoutView():step=='auth'?authView():step=='account'?accountView():shopView();badge();acctUI();requestAnimationFrame(reveal)}
(async()=>{const m=location.pathname.match(/^\/store\/(pay|done)\/(RS[A-Z0-9]{10})/);
 try{await load()}catch(e){return}badge();
 acctUI();if(m){$('#cartbtn').hidden=m[1]=='pay';$('#catbtn').hidden=true;return m[1]=='pay'&&S.mode=='test'?payView(m[2]):doneView(m[2])}
 locBar();acctUI();if(location.hash=='#account'){step=ME?'account':'auth';nextStep='account';authMode='signin';history.replaceState(null,'','/')}render();if(!LOC)setTimeout(locAsk,600);if(location.hash){const e=document.querySelector(location.hash);if(e)setTimeout(()=>e.scrollIntoView(),50)}})();
</script>
</body>
</html>
